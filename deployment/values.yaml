# Default values for trs-filer.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

host_name: ""

trs_filer:
  # if ingress.enabled: false, it will deploy an OpenShift Route (https://docs.redhat.com/en/documentation/openshift_container_platform/4.19/html/network_apis/route-route-openshift-io-v1)
  ingress:
    enabled: true
    https:
      enabled: false
      issuer: letsencrypt-prod
  image: elixircloud/trs-filer:latest
  appName: trs-filer
  # The image's Gunicorn defaults (one worker with four threads) peak at
  # about 175 MB (worker and master) under concurrent registrations; raise
  # the memory with more workers (`GUNICORN_CMD_ARGS`), which load the whole
  # app each (see deployment/README.md, Resources)
  resources:
    limits:
      cpu: 100m
      memory: 384Mi
    requests:
      cpu: 100m
      memory: 256Mi

apiServer: kubernetes.default.svc:443 # address of k8s API server

mongodb:
  image: docker.io/library/mongo:noble
  # https://github.com/elixir-cloud-aai/trs-filer/blob/9116b702bce2ef5b2e04130a6fe5db2a89d465f3/trs_filer/gunicorn.py#L26
  # If not set, it will use trs-filer-db
  dbName: ""
  volumeSize: 1Gi
  resources:
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 512Mi
