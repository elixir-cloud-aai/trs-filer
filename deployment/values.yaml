# Default values for trs-filer.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

host_name: ""

# The API has no authentication: restrict POST, PUT and DELETE at the
# ingress controller or a proxy in front of it (see deployment/README.md,
# Ingress)

trs_filer:
  # if ingress.enabled: false, it will deploy an OpenShift Route (https://docs.redhat.com/en/documentation/openshift_container_platform/4.19/html/network_apis/route-route-openshift-io-v1)
  ingress:
    enabled: true
    # Ingress class (`spec.ingressClassName`); the cluster default class if
    # empty
    className: ""
    # Annotations of the Ingress, e.g., for the ingress controller (to
    # restrict methods or clients); they take precedence over those that the
    # chart sets for `https`, and `null` removes one of these. Quote numbers
    # (e.g., `"1000000"`), as large ones would be written in exponent form
    annotations: {}
    https:
      enabled: false
      issuer: letsencrypt-prod
  image: elixircloud/trs-filer:latest
  appName: trs-filer
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi

apiServer: kubernetes.default.svc:443 # address of k8s API server

mongodb:
  image: docker.io/library/mongo:noble
  # https://github.com/elixir-cloud-aai/trs-filer/blob/9116b702bce2ef5b2e04130a6fe5db2a89d465f3/trs_filer/gunicorn.py#L26
  # If not set, it will use trs-filer-db
  dbName: ""
  volumeSize: 1Gi
  resources:
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 512Mi
