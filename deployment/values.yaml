# Default values for trs-filer.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

host_name: ""

# The API has no authentication: restrict POST, PUT and DELETE at the
# ingress controller, the OpenShift router or a proxy in front of them (see
# deployment/README.md, Ingress and Route)

trs_filer:
  ingress:
    enabled: true
    # Ingress class (`spec.ingressClassName`); the cluster default class if
    # empty
    className: ""
    # Annotations of the Ingress, e.g., for the ingress controller (to
    # restrict methods or clients); they take precedence over those that the
    # chart sets for `https`, and `null` removes one of these. Quote numbers
    # (e.g., `"1000000"`), as large ones would be written in exponent form
    annotations: {}
    https:
      enabled: false
      issuer: letsencrypt-prod
  # OpenShift Route for all paths (TLS at the router, which redirects HTTP
  # to HTTPS)
  route:
    # Create the Route if the Ingress is not enabled and the cluster serves
    # Routes; false, e.g., for a Route or HTTPRoute of your own
    enabled: true
    # Annotations of the Route, e.g., for rate limits of the router
    # (`haproxy.router.openshift.io/rate-limit-connections: "true"` with
    # `haproxy.router.openshift.io/rate-limit-connections.rate-http`) or to
    # allow only trusted clients (`haproxy.router.openshift.io/ip_allowlist`);
    # `null` removes one. Quote numbers (e.g., `"100"`), as large ones would
    # be written in exponent form
    annotations: {}
  image: elixircloud/trs-filer:latest
  appName: trs-filer
  # Addresses (or networks in CIDR notation), comma-separated, whose
  # `X-Forwarded-*` headers the app trusts (Gunicorn's
  # `FORWARDED_ALLOW_IPS`), so that its links keep `https` behind the
  # ingress controller or router that terminates TLS; `*` trusts every
  # address. Narrow it to those of the ingress controller or router (see
  # deployment/README.md, Forwarded headers)
  forwardedAllowIps: "*"
  # The image's Gunicorn defaults (one worker with four threads) peak at
  # about 175 MB (worker and master) under concurrent registrations; raise
  # the memory with more workers or threads, or a higher request size limit
  # (see deployment/README.md, Resources)
  resources:
    limits:
      cpu: 100m
      memory: 384Mi
    requests:
      cpu: 100m
      memory: 256Mi

apiServer: kubernetes.default.svc:443 # address of k8s API server

mongodb:
  # The version that CI tests; MongoDB 8.0 refuses to start on Linux kernels
  # 6.19 to 7.0.13 (https://jira.mongodb.org/browse/SERVER-121912). See
  # deployment/README.md (MongoDB) before changing the version of an existing
  # database. Pinned to a minor version; patch versions are updated on
  # restarts
  image: docker.io/library/mongo:7.0
  # Pull policy of the image (`Always`, `IfNotPresent` or `Never`); `Always`,
  # so that restarts get the latest patch version
  imagePullPolicy: Always
  # The app's database (`MONGO_DBNAME` of the app); `trs-filer-db` if empty
  dbName: ""
  # Size of the PersistentVolumeClaim `mongodb-<appName>` with the data;
  # Helm keeps the claim (`helm.sh/resource-policy: keep`) when the release
  # is uninstalled (see deployment/README.md, MongoDB)
  volumeSize: 1Gi
  resources:
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 512Mi
