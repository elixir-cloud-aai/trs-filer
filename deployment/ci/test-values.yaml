# Values for linting and testing the chart (CI, `release.yml`,
# `tests/test_chart.py`): the name of a Secret with MongoDB's credentials,
# which rendering requires with authentication (the default), a host name,
# and the settings each deployment must make, with a fictitious identity
# provider (rendering fails without trusted token issuers, an audience and an
# admin group). Not part of the packaged chart (`.helmignore`)
hostName: trs.example.org
mongodb:
  auth:
    existingSecret: trs-filer-mongodb-credentials
config:
  security:
    auth:
      issuers: ["https://login.example.org/oidc/"]
      audience: ["test-client"]
    access_control:
      claim_groups: groups
      group_mapping:
        test-admins: admin
