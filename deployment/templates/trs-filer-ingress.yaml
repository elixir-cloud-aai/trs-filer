{{ if .Values.trs_filer.ingress.enabled }}
{{- /* The chart's annotations (cert-manager, for `https`), overridden by
those of `ingress.annotations`; `null` there removes one of the chart's */}}
{{- $annotations := dict }}
{{- if .Values.trs_filer.ingress.https.enabled }}
{{- $_ := set $annotations "cert-manager.io/cluster-issuer" .Values.trs_filer.ingress.https.issuer }}
{{- $_ := set $annotations "kubernetes.io/tls-acme" "true" }}
{{- end }}
{{- range $key, $value := .Values.trs_filer.ingress.annotations }}
{{- if kindIs "invalid" $value }}
{{- $_ := unset $annotations $key }}
{{- else }}
{{- $_ := set $annotations $key (toString $value) }}
{{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  name: {{ .Values.trs_filer.appName }}-ingress
spec:
  {{- with .Values.trs_filer.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.host_name }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.trs_filer.appName }}
                port:
                  number: 8080
{{- if .Values.trs_filer.ingress.https.enabled }}
  tls:
  - hosts:
    - {{ .Values.host_name }}
    secretName: {{ .Values.trs_filer.appName }}-ingress-secret
{{- end }}
{{ end }}
