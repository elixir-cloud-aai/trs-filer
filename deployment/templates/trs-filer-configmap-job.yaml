apiVersion: v1
data:
  config.yaml: '# Empty, this configMap will be filled by Job (configmap-job-{{ .Values.trs_filer.appName }})'
kind: ConfigMap
metadata:
  name: app-config-{{ .Values.trs_filer.appName }}
---
apiVersion: batch/v1
kind: Job
metadata:
  # Named by release revision, as the pod template of a Job is immutable: an
  # upgrade replaces the Job (and reruns it) instead of patching it
  name: configmap-job-{{ .Values.trs_filer.appName }}-{{ .Release.Revision }}
spec:
  template:
    spec:
      containers:
      - name: certbot
        image: {{ .Values.trs_filer.image }}
        imagePullPolicy: {{ .Values.trs_filer.imagePullPolicy | default "Always" }}
        # The base config, installed with the package: found via the
        # package, so that no path depends on the image's Python version
        # (exit 4 if it isn't installed); set here, not in the script, so
        # that images with older scripts work too
        command:
        - /bin/sh
        - -c
        - |
          APP_CONFIG_PATH="$(python3 -c 'import importlib.util, os, sys; spec = importlib.util.find_spec("trs_filer"); spec or sys.exit("ERROR: Cannot find the package trs_filer"); print(os.path.join(spec.submodule_search_locations[0], "config.yaml"))')" || exit 4
          export APP_CONFIG_PATH
          exec /app/update-config-map.sh
        env:
        - name: APISERVER
          value: {{ .Values.apiServer }}
        - name: CONFIG_MAP_NAME
          value: app-config-{{ .Values.trs_filer.appName }}
        - name: APP_NAME
          value: {{ .Values.trs_filer.appName }}
        - name: HOST_NAME
          value:  {{ .Values.host_name }}
        - name: MONGO_HOST
          value: mongodb-{{ .Values.trs_filer.appName }}
        # The app's security contexts (same image); the script writes to
        # `/tmp`, writable, as the root file system is read-only by default
        securityContext:
          {{- include "trs-filer.securityContext" (dict "root" . "context" .Values.trs_filer.securityContext) | nindent 10 }}
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      restartPolicy: Never
      securityContext:
        {{- include "trs-filer.securityContext" (dict "root" . "context" .Values.trs_filer.podSecurityContext) | nindent 8 }}
      serviceAccountName: {{ .Values.trs_filer.appName }}-configurer
      volumes:
      - name: tmp
        emptyDir: {{ include "trs-filer.emptyDir" .Values.trs_filer.tmpSizeLimit }}
status: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  creationTimestamp: null
  name: {{ .Values.trs_filer.appName }}-configurer
---
# Only the rights that `update-config-map.sh` uses: read and patch the app's
# ConfigMap, and list and delete pods to restart the app (TEMPORARY, with the
# Job, until the chart uses the FOCA library chart: #135)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.trs_filer.appName }}-configurer
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["app-config-{{ .Values.trs_filer.appName }}"]
  verbs: ["get", "patch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["list", "delete"]
---
# Was `admin-<appName>-configurer` (bound to the ClusterRole `admin`); a new
# name, as `roleRef` can't be changed: upgrades replace the binding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.trs_filer.appName }}-configurer
roleRef:
  name: {{ .Values.trs_filer.appName }}-configurer
  kind: Role
  apiGroup: rbac.authorization.k8s.io
subjects:
- kind: ServiceAccount
  name: {{ .Values.trs_filer.appName }}-configurer
