{{- if include "trs-filer.route" . }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  {{- /* Values as strings; `null` leaves an annotation out */}}
  {{- $annotations := dict }}
  {{- range $key, $value := (dig "route" "annotations" (dict) .Values.trs_filer) }}
  {{- if not (kindIs "invalid" $value) }}
  {{- $_ := set $annotations $key (toString $value) }}
  {{- end }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  name: {{ .Values.trs_filer.appName }}-route
spec:
  host: {{ .Values.host_name }}
  port:
    targetPort: {{ .Values.trs_filer.appName }}
  tls:
    insecureEdgeTerminationPolicy: Redirect
    termination: edge
  to:
    kind: Service
    name: {{ .Values.trs_filer.appName }}
    weight: 100
  wildcardPolicy: None
status:
  ingress: []
{{ end }}
