apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.trs_filer.appName }}
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: {{ .Values.trs_filer.appName }}
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: {{ .Values.trs_filer.appName }}
    spec:
      containers:
      - image: {{ .Values.trs_filer.image }}
        imagePullPolicy: Always
        name: {{ .Values.trs_filer.appName }}
        env:
          # The app's database (value `mongodb.dbName`, `trs-filer-db` if
          # empty) and MongoDB's Service, which FOCA reads instead of the
          # config's `db`, so that the app reaches MongoDB also if the Job
          # failed
          - name: MONGO_DBNAME
            value: {{ tpl (default "trs-filer-db" .Values.mongodb.dbName) . }}
          - name: MONGO_HOST
            value: mongodb-{{ .Values.trs_filer.appName }}
          # The config that the Job renders, merged into the base config
          - name: FOCA_CONFIG_OVERLAY
            value: /etc/trs-filer/config.yaml
          # Trust `X-Forwarded-*` of the ingress (or route), which terminates
          # TLS, so that links in responses keep `https` (see
          # `trs-filer.forwardedAllowIps`)
          - name: FORWARDED_ALLOW_IPS
            value: {{ include "trs-filer.forwardedAllowIps" . | quote }}
        ports:
        - containerPort: 8080
          protocol: TCP
        resources: {{- toYaml .Values.trs_filer.resources | nindent 10 }}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /etc/trs-filer/config.yaml
          name: config-yaml
          subPath: config.yaml
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          items:
            - key: config.yaml
              path: config.yaml
          name: app-config-{{ .Values.trs_filer.appName }}
        name: config-yaml
