apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.trs_filer.appName }}
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: {{ .Values.trs_filer.appName }}
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: {{ .Values.trs_filer.appName }}
    spec:
      containers:
      - image: {{ .Values.trs_filer.image }}
        imagePullPolicy: Always
        name: {{ .Values.trs_filer.appName }}
        # https://github.com/elixir-cloud-aai/trs-filer/blob/9116b702bce2ef5b2e04130a6fe5db2a89d465f3/trs_filer/gunicorn.py#L26
        # If not set in values.yaml, it will use trs-filer-db
        env:
          - name: MONGO_DBNAME
            value: {{ .Values.mongodb.dbName | default "trs-filer-db" }}
        ports:
        - containerPort: 8080
          protocol: TCP
        resources: {{- toYaml .Values.trs_filer.resources | nindent 10 }}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /app/trs_filer/config.yaml
          name: config-yaml
          subPath: config.yaml
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          items:
            - key: config.yaml
              path: config.yaml
          name: app-config-{{ .Values.trs_filer.appName }}
        name: config-yaml

