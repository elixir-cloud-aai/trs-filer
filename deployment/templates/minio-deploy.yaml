apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio-{{ .Values.trs_filer.appName }}
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: minio-{{ .Values.trs_filer.appName }}
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: minio-{{ .Values.trs_filer.appName }}
    spec:
      containers:
      - image: {{ .Values.minio.image }}
        imagePullPolicy: Always
        name: minio-{{ .Values.trs_filer.appName }}
        args:
        - server
        - /data
        - --console-address
        - :{{ .Values.minio.consolePort }}
        env:
        - name: MINIO_ROOT_USER
          value: {{ .Values.minio.accessKey }}
        - name: MINIO_ROOT_PASSWORD
          value: {{ .Values.minio.secretKey }}
        ports:
        - containerPort: {{ .Values.minio.apiPort }}
          name: api
          protocol: TCP
        - containerPort: {{ .Values.minio.consolePort }}
          name: console
          protocol: TCP
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /data
          name: minio-{{ .Values.trs_filer.appName }}
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: minio-{{ .Values.trs_filer.appName }}
        persistentVolumeClaim:
          claimName: minio-{{ .Values.trs_filer.appName }}
status:
