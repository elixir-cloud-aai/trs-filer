apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-{{ .Values.trs_filer.appName }}
  annotations:
    # Keep the data when the release is uninstalled, or when the claim is
    # removed from the chart (e.g., renamed)
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.mongodb.volumeSize }}
status:
