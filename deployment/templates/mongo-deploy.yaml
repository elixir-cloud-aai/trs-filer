apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-{{ .Values.trs_filer.appName }}
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: mongodb-{{ .Values.trs_filer.appName }}
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: mongodb-{{ .Values.trs_filer.appName }}
    spec:
      containers:
      - image: {{ .Values.mongodb.image }}
        imagePullPolicy: Always
        name: mongodb-{{ .Values.trs_filer.appName }}
        ports:
        - containerPort: 27017
          protocol: TCP
        resources: {{- toYaml .Values.mongodb.resources | nindent 10 }}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /data/db/
          name: mongodb-{{ .Values.trs_filer.appName }}
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d/init-script.js
          subPath: init-script.js
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: mongodb-{{ .Values.trs_filer.appName }}
        persistentVolumeClaim:
          claimName: mongodb-{{ .Values.trs_filer.appName }}
      - name: init-script
        configMap:
          name: mongo-init-script
