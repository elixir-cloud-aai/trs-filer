apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-{{ .Values.trs_filer.appName }}
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: mongodb-{{ .Values.trs_filer.appName }}
  # The data volume can be used by one pod only: stop the old pod first
  strategy:
    type: Recreate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: mongodb-{{ .Values.trs_filer.appName }}
    spec:
      containers:
      - image: {{ .Values.mongodb.image }}
        imagePullPolicy: {{ .Values.mongodb.imagePullPolicy }}
        name: mongodb-{{ .Values.trs_filer.appName }}
        ports:
        - containerPort: 27017
          protocol: TCP
        resources: {{- toYaml .Values.mongodb.resources | nindent 10 }}
        securityContext:
          {{- include "trs-filer.securityContext" (dict "root" . "context" .Values.mongodb.securityContext) | nindent 10 }}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /data/db/
          name: mongodb-{{ .Values.trs_filer.appName }}
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d/init-script.js
          subPath: init-script.js
        # Writable, as the root file system is read-only by default: the
        # socket and the files of the entrypoint's first start (`/tmp`) and
        # the config database directory declared by the image
        - mountPath: /tmp
          name: tmp
        - mountPath: /data/configdb
          name: configdb
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        {{- include "trs-filer.securityContext" (dict "root" . "context" .Values.mongodb.podSecurityContext) | nindent 8 }}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: mongodb-{{ .Values.trs_filer.appName }}
        persistentVolumeClaim:
          claimName: mongodb-{{ .Values.trs_filer.appName }}
      - name: tmp
        emptyDir: {{ include "trs-filer.emptyDir" .Values.mongodb.tmpSizeLimit }}
      - name: configdb
        emptyDir: {}
      - name: init-script
        configMap:
          name: mongo-init-script-{{ .Values.trs_filer.appName }}
