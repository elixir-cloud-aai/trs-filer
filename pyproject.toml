[build-system]
# CI installs setuptools-scm with the same bound to compute the version of
# images (`.github/workflows/checks.yaml`)
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.coverage.run]
source = ["trs_filer", "scripts"]

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']

[project]
name = "trs-filer"
authors = [
    {name = "ELIXIR On-Cloud", email = "cloud-service@elixir-europe.org"},
]
keywords = [
    "ga4gh", "trs", "tool", "registry", "elixir", "cloud", "rest", "restful",
    "api", "app", "server", "openapi", "swagger", "mongodb", "python", "flask",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
# The Python version of the base image in the `Dockerfile`, the only one the
# app is tested with
requires-python = ">=3.13"
description = "GA4GH Tool Registry Service (TRS) implementation by ELIXIR On-Cloud"
license = "Apache-2.0"
dynamic = ["version"]
dependencies = [
    "connexion>=2.15.1,<4.0.0",
    # FOCA minors are bumped by hand, together with the base image in the
    # `Dockerfile` (`.github/dependabot.yml`).
    # TEMPORARY: a commit on FOCA's `dev` branch, to use FOCA 0.17 before its
    # release (#88); replaced by `foca>=0.17.0,<0.18` before the next
    # release, which `scripts/check_release_pins.py` enforces
    "foca @ git+https://github.com/elixir-cloud-aai/foca@29af8a64a2b0aae21845fa37a4a54076811f62bf",
    "gunicorn>=26.2.0,<27",
    # Remote files are retrieved with connection classes of urllib3 2.x
    # (`trs_filer/remote_files.py`)
    "requests>=2.31,<3",
    "urllib3>=2.2,<3",
]

[project.optional-dependencies]
dev = [
    "build>=1.6",
    "coverage>=7.16",
    # TEMPORARY: the linter until the shared ruff, mypy and pre-commit setup
    # replaces it (#106); settings in `.flake8`
    "flake8>=7.1",
    "mongomock>=4.3",
    "packaging>=26.3",
    "pytest>=9.1",
    # Used by the tests; builds use `build-system.requires`
    "setuptools-scm>=10.3",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
homepage = "https://github.com/elixir-cloud-aai/trs-filer"
Issues = "https://github.com/elixir-cloud-aai/trs-filer/issues"

[tool.setuptools_scm]
# Version from Git tags (`vX.Y.Z`), the only place it is stored; builds
# without Git metadata (e.g., Docker builds, which get no `.git`) report the
# fallback unless `SETUPTOOLS_SCM_PRETEND_VERSION` is set
fallback_version = "0.0.0.dev0"

[tool.setuptools.packages.find]
include = ["trs_filer*"]

[tool.setuptools.package-data]
trs_filer = [
    "config.yaml",
    "api/*.yaml",
    "api/patches/*.yaml",
]
