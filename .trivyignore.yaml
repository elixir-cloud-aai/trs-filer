# Vulnerabilities accepted in the Docker image (`Dockerfile`), which the
# scans in CI, the release workflow and the weekly scan (shared action
# `scan-image` of `elixir-cloud-aai/.github`) ignore: each with the reason
# (`statement`) and an expiry date (`expired_at`), after which Trivy reports
# it again, so that the decision is reviewed. Limit entries to the affected
# package versions (`purls`), so that other packages with the same
# vulnerability are still reported. Example:
#
#   vulnerabilities:
#     - id: CVE-2026-12345
#       purls: ["pkg:pypi/example@1.2.3"]
#       statement: Only in the test extra, which the image does not install
#       expired_at: 2027-01-31
#
# See https://trivy.dev/latest/docs/configuration/filtering/#trivyignoreyaml
vulnerabilities:
  # Copy vendored by pip (listed in its SBOM, `pip/_vendor/bom.cdx.json`),
  # used only when pip runs (to install the app's dependencies at build time),
  # not by the app, which has no setuptools of its own in the image. pip 26.3,
  # the latest release on 2026-11-03 and the one the image upgrades to
  # (`Dockerfile`), still vendors this version. Trivy reports the vendored
  # copy without a path, so the entries can't be limited with `paths`; they
  # would also hide this version if installed normally. Accepted alike in
  # cloud-registry; removing pip from the image (#218) ends the need for them
  - id: CVE-2025-47273
    purls: ["pkg:pypi/setuptools@70.3.0"]
    statement: Vendored by pip, not used by the app (path traversal in PackageIndex, which pip doesn't use)
    expired_at: 2027-01-31
  - id: CVE-2026-59890
    purls: ["pkg:pypi/setuptools@70.3.0"]
    statement: Vendored by pip, not used by the app (MANIFEST.in exclusion bypass in sdist builds on macOS; pip vendors only pkg_resources)
    expired_at: 2027-01-31
  - id: GHSA-xmj3-9gf7-h52w
    purls: ["pkg:pypi/setuptools@70.3.0"]
    statement: Vendored by pip, not used by the app (Windows path escape in legacy wheel installation; the image is Linux, and pip vendors only pkg_resources)
    expired_at: 2027-01-31
