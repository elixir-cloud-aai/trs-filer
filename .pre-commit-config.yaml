# Checks run on commit (`pre-commit install`) and in CI (`pre-commit run
# --all-files`, plus the manual-stage `gitleaks-all` hook); hook versions are
# pinned to commits
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        # The lock of all dependencies (`uv.lock`, generated by uv) is larger
        exclude: ^uv\.lock$
      - id: check-merge-conflict
      - id: check-yaml
        # Helm templates are not valid YAML before rendering; `mkdocs.yml`
        # uses MkDocs' `!ENV` tag (the docs build checks it)
        exclude: ^(deployment/templates/|mkdocs\.yml$)
      # Vendored GA4GH specifications are kept as published
      - id: end-of-file-fixer
        exclude: ^trs_filer/api/[0-9]{8}\.
      - id: trailing-whitespace
        exclude: ^trs_filer/api/[0-9]{8}\.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c  # frozen: v0.17.3
    hooks:
      - id: ruff-check
      - id: ruff-format
  # Rules and their tests in `.semgrep/`
  - repo: https://github.com/semgrep/pre-commit
    rev: a19f9deb8c211c43e469e994fa8ee15178bc1b1d  # frozen: v1.183.0
    hooks:
      - id: semgrep
        args:
          - --config=.semgrep
          - --error
          - --metrics=off
          - --disable-version-check
          - --quiet
          - --skip-unknown-extensions
        # The rule tests contain findings on purpose
        exclude: ^\.semgrep/
      - id: semgrep
        alias: semgrep-test
        name: semgrep rule tests
        # semgrep finds no tests in hidden directories passed as targets
        entry: >-
          sh -c 'cd .semgrep &&
          semgrep --test --metrics=off --disable-version-check --quiet .'
        files: ^\.semgrep/
        pass_filenames: false
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      # Staged changes on commit
      - id: gitleaks
      # The whole checkout, in CI (`--hook-stage manual`); also scans
      # untracked and ignored files when run locally
      - id: gitleaks
        alias: gitleaks-all
        name: Detect hardcoded secrets (all files)
        entry: gitleaks dir --redact --verbose
        stages: [manual]
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      # Workflows (`.github/workflows/`); also checks their scripts with
      # shellcheck if it is installed (as on GitHub-hosted runners)
      - id: actionlint
  - repo: local
    hooks:
      # Local hooks use the installed dev dependencies (the `dev` extra of
      # `pyproject.toml`); mypy needs them to check imported packages. Rules
      # of ast-grep and their tests in `.ast-grep/` (`sgconfig.yml`)
      - id: ast-grep
        name: ast-grep
        entry: ast-grep scan
        language: system
        types: [python]
      - id: ast-grep-test
        name: ast-grep rule tests
        entry: ast-grep test --skip-snapshot-tests
        language: system
        files: ^(sgconfig\.yml|\.ast-grep/)
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
