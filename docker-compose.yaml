version: '3.6'
services:

    trs:
        image: elixircloud/trs-filer:latest
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        links:
            - mongodb
        ports:
            - "80:8080"

    mongodb:
        # Current PyMongo releases refuse to connect to MongoDB 3.6; MongoDB
        # 8.0 does not start on Linux kernels 6.19 to 7.0.13
        # (https://jira.mongodb.org/browse/SERVER-121912)
        image: mongo:7.0
        restart: unless-stopped
        volumes:
            - ../data/trs/db:/data/db
        ports:
            - "27017:27017"
