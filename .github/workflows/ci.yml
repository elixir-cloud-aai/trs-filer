# Everything that must pass on pull requests and pushes to `dev`: the pull
# request title, lint, build, test, lint and test the Helm chart, install it
# on a kind cluster, build the docs, run the app with Docker Compose, check the
# readiness of a release in preparation, scan the Docker image for known
# vulnerabilities, and, on pushes, push the Docker image by digest (with
# SBOM and provenance attestations), scan exactly that digest, then attest,
# sign (Sigstore) and tag it `dev` and `sha-<commit>` once all other jobs
# passed. Forks, which have none of the secrets, run the same checks
# without publishing, unless they set the repository variable
# `DOCKERHUB_ORG` to publish to their own organization.
# `github.repository_owner == 'elixir-cloud-aai'` marks runs of the upstream
# repository. The gate `passed` ("CI passed") is the only required check. No
# `paths:` filters, so that the gate always reports; skip jobs with `if:`
# instead (and allow the skip in the gate). Runs also when a pull request is
# edited, so that the title check follows the title; all jobs run then, as a
# run that skipped the tests would report "CI passed" for the commit.
# Releases are published by `release.yml`, which requires a successful run of
# this workflow for the push of the release commit

name: CI
on:
  push:
    branches: [dev]
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [dev]

permissions:
  contents: read

# Fully qualified (`docker.io/`), as the attestation needs it. The Docker Hub
# organization is the repository variable `DOCKERHUB_ORG` (by default
# `elixircloud`), as in `release.yml` and `scan.yml`, so that the scan job,
# which has no secrets, scans the image that is published
env:
  IMAGE_NAME: docker.io/${{ vars.DOCKERHUB_ORG || 'elixircloud' }}/trs-filer
  # "true" if this run publishes the image: pushes to this repository, or to
  # a fork that sets `DOCKERHUB_ORG` (and the Docker Hub secrets). Jobs' `if:`
  # can't read `env`, so `push` and `publish` repeat the expression
  # (`tests/test_workflows.py`)
  PUBLISH: ${{ github.event_name == 'push' && (github.repository_owner == 'elixir-cloud-aai' || vars.DOCKERHUB_ORG != '') }}

# Only a new head commit of a pull request cancels its runs in progress
# (action `synchronize`, first attempt); runs for other actions and reruns
# wait, so that a run on the same commit never leaves a cancelled, failed
# `CI passed` (see "Cancelled runs" in `actions/gate/README.md` of
# `elixir-cloud-aai/.github`). Runs for pushes get their own group, so that
# none is dropped. Runs for edits that leave the title unchanged (e.g. of
# the description, also by bots) share a group of their own, so that they
# don't wait for the run for the pull request's commit
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'push' && github.sha ||
      github.event.action == 'edited' && !github.event.changes.title &&
        format('{0}-edited', github.ref) ||
      github.ref }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request'
    && github.event.action == 'synchronize'
    && github.run_attempt == 1 }}

jobs:

  # Pull request titles become the commit messages on `dev` (squash merges):
  # Conventional Commits, at most 50 characters (shared action of
  # elixir-cloud-aai/.github, pinned to the commit of a release). Skipped on
  # pushes and for Dependabot, whose titles can't be configured to pass,
  # unless someone else edits the title
  title:
    name: PR title
    if: >-
      github.event_name == 'pull_request' && (
        github.event.pull_request.user.login != 'dependabot[bot]' ||
        github.event.changes.title &&
        github.event.sender.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check PR title
        uses: elixir-cloud-aai/.github/actions/pr-title@743e82d290a53768454999e413756a924e383259 # v1.0.0

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # All jobs use the Python version of the base image in the `Dockerfile`
      # (`requires-python` in `pyproject.toml`), the only one the app targets
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # uv, at the version locked in `uv.lock` (a dev dependency); the action
      # checks its checksum (from its own list for the versions it knows,
      # otherwise from uv's version manifest)
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: uv.lock
      # The lock must match `pyproject.toml` (run `uv lock` after changing
      # dependencies; `uv sync --locked` below checks it too, but this step
      # names the failure)
      - name: Check lock file
        run: uv lock --check
      # The versions of `uv.lock`, checked against its hashes, so that pull
      # requests that change only the lock (e.g., Dependabot's) are tested on
      # it; `--locked` fails if the lock doesn't match `pyproject.toml`. Into
      # `.venv`, with the Python set up above. The app itself is installed
      # editable, built in an isolated build environment (its build
      # requirements from the index, not the lock). mypy checks imports, so
      # runtime dependencies are needed too
      - name: Install dependencies
        run: |
          uv sync --locked --extra dev --python "$(which python)"
          echo "${PWD}/.venv/bin" >> "$GITHUB_PATH"
      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run linters, type checks and security checks
        run: |
          pre-commit run --all-files --show-diff-on-failure
          pre-commit run --all-files --hook-stage manual gitleaks-all
      # In its own environment, as cffconvert pins an old jsonschema; its
      # dependencies resolve within its own bounds. 2.0.0 is the latest stable
      # release (not bumped by Dependabot; update manually)
      - name: Validate citation metadata
        run: pipx run --spec cffconvert==2.0.0 cffconvert --validate -i CITATION.cff
      - name: Build distributions
        run: python -m build
      - name: Check wheel contents
        run: |
          unzip -Z1 dist/*.whl | tee wheel-contents.txt
          if grep -Ev '^trs_filer(/|-[^/]+\.dist-info/)' wheel-contents.txt; then
            echo "::error::Unexpected files in wheel"
            exit 1
          fi
          grep -qx 'trs_filer/config.yaml' wheel-contents.txt
          grep -Eqx 'trs_filer-[^/]+\.dist-info/licenses/LICENSE' wheel-contents.txt
          grep -q '^trs_filer/api/.*\.yaml$' wheel-contents.txt
  # The tests against mongomock (with coverage) and against MongoDB, the
  # database of deployments (`MONGODB_TEST_URI`, see `tests/conftest.py`), in
  # the version of `docker-compose.yaml` (MongoDB 8.0 refuses to start on some
  # kernels, see there). The tests of object storage (`tests/test_storage.py`)
  # use an in-memory S3 (moto) with mongomock, and an S3-compatible server,
  # SeaweedFS (Apache-2.0), with MongoDB (`S3_TEST_ENDPOINT_URL`)
  test:
    name: Test (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: mongomock
            image: ""
            uri: ""
            s3: ""
          - database: MongoDB 7.0
            image: mongo:7.0
            uri: mongodb://localhost:27017
            s3: http://localhost:8333
    services:
      # Not started for an empty image (the `mongomock` entry)
      mongodb:
        image: ${{ matrix.image }}
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MONGODB_TEST_URI: ${{ matrix.uri }}
      S3_TEST_ENDPOINT_URL: ${{ matrix.s3 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # As in `lint`
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: uv.lock
      # The versions of `uv.lock`, as in `lint`
      - name: Install dependencies
        run: |
          uv sync --locked --extra dev --python "$(which python)"
          echo "${PWD}/.venv/bin" >> "$GITHUB_PATH"
      # The chart tests (run if Helm is installed, as on GitHub's runners)
      # need the library chart, the version locked in `Chart.lock`
      - name: Build chart dependencies
        run: |
          # The library chart is then checked as when it was pinned: OCI
          # tags can be pushed again
          helm dependency build deployment
          (cd deployment && sha256sum -c charts.sha256)
      - name: Calculate unit test coverage
        if: ${{ matrix.uri == '' }}
        run: |
          coverage run -m pytest -W ignore::DeprecationWarning
          coverage xml
      # Upload errors fail the workflow only on branch pushes to the upstream
      # repository: pull requests from forks and Dependabot, and pushes in
      # forks, have no access to its Codecov token (so failures are
      # deliberately non-fatal there), and release tags shouldn't fail for
      # Codecov outages
      - name: Submit Report to Codecov
        if: ${{ matrix.uri == '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.repository_owner == 'elixir-cloud-aai' }}
          verbose: true
      # A container, as service containers can't be given a command; S3 API
      # only, without authentication (the tests sign requests with test
      # credentials, which it accepts). Pinned to a release by digest (bump
      # by hand, together with the examples in `docs/configuration.md` and
      # `docs/development.md`)
      - name: Start S3-compatible server
        if: ${{ matrix.s3 != '' }}
        run: |
          docker run --detach --name seaweedfs --publish 8333:8333 \
            docker.io/chrislusf/seaweedfs:4.51@sha256:f7a49e3f3972ebed5be2ed4befa4a0c68eb7bdddba6e692d42729ceb545134b8 \
            server -s3 -ip.bind=0.0.0.0
          for _ in $(seq 60); do
            curl --silent --output /dev/null "${S3_TEST_ENDPOINT_URL}" && exit 0
            sleep 2
          done
          docker logs seaweedfs
          exit 1
      # `tests/test_fixtures.py` checks that the tests use the MongoDB
      - name: Run tests against MongoDB
        if: ${{ matrix.uri != '' }}
        run: pytest -W ignore::DeprecationWarning

  # The Helm chart (`deployment/`), which the release workflow packages, with
  # FOCA's library chart: checks the library chart against its digest, lints
  # the chart as `release.yml` does and renders it (`tests/test_chart.py`).
  # `test` runs these tests too, with the runner's Helm; this job with the
  # Helm of the release
  chart:
    name: Chart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # As in `lint`
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: uv.lock
      # The versions of `uv.lock`, as in `lint`
      - name: Install dependencies
        run: |
          uv sync --locked --extra dev --python "$(which python)"
          echo "${PWD}/.venv/bin" >> "$GITHUB_PATH"
      # Same Helm version as in `release.yml` and the other chart job (bump
      # all by hand)
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1
      # The library chart foca-common, the version locked in `Chart.lock`
      - name: Build chart dependencies
        run: |
          # The library chart is then checked as when it was pinned: OCI
          # tags can be pushed again
          helm dependency build deployment
          (cd deployment && sha256sum -c charts.sha256)
      # As `prepare` of `release.yml` lints it (with the values that users
      # must pass, e.g., the Secret of MongoDB's credentials, so that the
      # templates render as installed), and without authentication
      - name: Lint chart
        run: |
          helm lint deployment --strict -f deployment/ci/test-values.yaml
          helm lint deployment --strict -f deployment/ci/test-values.yaml \
            --set mongodb.auth.enabled=false --set mongodb.auth.existingSecret=
      # The tests fail instead of skipping if Helm is missing (`CI`)
      - name: Test chart
        run: |
          helm version
          pytest -W ignore::DeprecationWarning tests/test_chart.py

  # The chart as deployed in a cluster: installs it on kind (the defaults,
  # with the values of `deployment/ci/test-values.yaml`: a host name, an
  # identity provider and the Secret of MongoDB's credentials, created here
  # with random passwords), with the image built from the commit, loaded into
  # the cluster's node (pushed nowhere, so the job needs no secrets and runs
  # for pull requests from forks), waits until the app is ready, and checks
  # the API through a port forward (the Ingress has no controller on kind):
  # the service info, and the registration and retrieval of a tool, whose URL
  # has the host name that the chart renders into the app's config overlay.
  # See "Helm chart" in `docs/development.md` for running it locally
  chart-install:
    name: Chart install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLUSTER: trs-filer
      NAMESPACE: trs-filer
      # A local name, which no registry serves: the chart uses the image
      # loaded into the node (`imagePullPolicy: Never`)
      IMAGE: trs-filer:ci
      # The app's pods of the release `trs-filer`
      APP_PODS: app.kubernetes.io/instance=trs-filer,app.kubernetes.io/component=app
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same Helm version as in `release.yml` and the other chart job (bump
      # all by hand)
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1
      # The library chart foca-common, as in `chart`
      - name: Build chart dependencies
        run: |
          helm dependency build deployment
          (cd deployment && sha256sum -c charts.sha256)
      # Dependabot updates the action, but not the kind version: bump it by
      # hand (see "Versioning and releases" in `docs/development.md`)
      - name: Create kind cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          version: v0.33.0
          cluster_name: ${{ env.CLUSTER }}
      # The version is passed as in `smoke` (the build gets no Git metadata)
      - name: Build and load image
        run: |
          docker build --build-arg SETUPTOOLS_SCM_PRETEND_VERSION=0.0.0+kind \
            --tag "${IMAGE}" .
          kind load docker-image "${IMAGE}" --name "${CLUSTER}"
      # The Secret named in `deployment/ci/test-values.yaml`; `--wait` waits
      # until the app and MongoDB are ready (readiness probes)
      - name: Install chart
        run: |
          kubectl create namespace "${NAMESPACE}"
          kubectl create secret generic trs-filer-mongodb-credentials \
            -n "${NAMESPACE}" \
            --from-literal=root-username=root \
            --from-literal=root-password="$(openssl rand -hex 24)" \
            --from-literal=username=trs-filer \
            --from-literal=password="$(openssl rand -hex 24)"
          helm install trs-filer deployment -n "${NAMESPACE}" \
            -f deployment/ci/test-values.yaml \
            --set trsFiler.image="${IMAGE}" \
            --set trsFiler.imagePullPolicy=Never \
            --wait --timeout 600s
      - name: Check API
        env:
          API: http://localhost:8080/ga4gh/trs/v2
          # `hostName` of `deployment/ci/test-values.yaml`
          HOST: trs.example.org
        run: |
          body="${RUNNER_TEMP}/body.json"
          log="${RUNNER_TEMP}/port-forward.log"
          pid=""
          trap '[[ -n "${pid}" ]] && kill "${pid}" 2> /dev/null || true' EXIT
          # Wait for the app with its config and forward its port
          connect() {
            if [[ -n "${pid}" ]]; then
              kill "${pid}" 2> /dev/null || true
              pid=""
            fi
            kubectl rollout status deployment/trs-filer -n "${NAMESPACE}" \
              --timeout=300s
            # Upgrades replace the app's pods (rolling update): wait until the
            # old ones are gone, so that the port forward (which picks a pod
            # of the Service once) doesn't reach a terminating pod with the
            # old config
            for _ in $(seq 60); do
              if ! kubectl get pods -n "${NAMESPACE}" -l "${APP_PODS}" -o json \
                  | jq -e 'any(.items[]; .metadata.deletionTimestamp)' > /dev/null; then
                break
              fi
              sleep 2
            done
            # A port forward ends on a refused connection, so it is restarted
            # until the app answers
            for _ in $(seq 60); do
              if [[ -z "${pid}" ]] || ! kill -0 "${pid}" 2> /dev/null; then
                kubectl port-forward -n "${NAMESPACE}" service/trs-filer \
                  8080:8080 >> "${log}" 2>&1 &
                pid=$!
                sleep 2
              fi
              if curl --fail --silent --max-time 10 --output /dev/null \
                  "${API}/service-info"; then
                break
              fi
              sleep 5
            done
          }
          # Request a path, with an optional JSON body; check the status and
          # that the JSON response matches a jq filter. As in `smoke` (keep
          # both alike), plus a time limit, as the port forward may hang, and
          # the port forward's log on failures
          check() {
            local method="$1" path="$2" status="$3" filter="$4" data="${5:-}" actual
            local args=(--silent --show-error --max-time 30 --output "${body}"
              --write-out '%{http_code}' -X "${method}"
              --header 'Accept: application/json')
            if [ -n "${data}" ]; then
              args+=(--header 'Content-Type: application/json' --data "${data}")
            fi
            actual="$(curl "${args[@]}" "${API}${path}")" || true
            if [ "${actual}" != "${status}" ] \
                || ! jq -e "${filter}" "${body}" > /dev/null; then
              echo "::error::${method} ${path}: status ${actual}, expected ${status} and ${filter}"
              cat "${body}" || true
              cat "${log}"
              return 1
            fi
          }
          tool='{
            "name": "kind",
            "organization": "Example",
            "toolclass": {"id": "kind", "name": "Kind", "description": "Chart install"},
            "versions": [{
              "name": "v1",
              "is_production": false,
              "descriptor_type": ["CWL"],
              "files": [{
                "type": "CWL",
                "tool_file": {"file_type": "PRIMARY_DESCRIPTOR", "path": "main.cwl"},
                "file_wrapper": {"content": "cwlVersion: v1.2"}
              }]
            }]
          }'
          connect
          # Reads are public; writes need a token of the (fictitious)
          # identity provider of the test values
          check GET /service-info 200 '.type.artifact == "trs"'
          check GET /tools 200 '. == []'
          check POST /tools 401 '.status == 401' "${tool}"
          # Writes without authentication (`config` value of the chart; for
          # this test only, see "Running without authentication" in
          # `docs/development.md`), to check the public URL that the chart
          # sets; the changed value restarts the app (checksum of its overlay)
          helm upgrade trs-filer deployment -n "${NAMESPACE}" --reuse-values \
            --set config.api.specs.trs.disable_auth=true \
            --wait --timeout 600s
          connect
          check POST /tools 200 'type == "string"' "${tool}"
          id="$(jq -r . "${body}")"
          check GET "/tools/${id}" 200 \
            ".id == \"${id}\" and .name == \"kind\" and .url == \"https://${HOST}:443/ga4gh/trs/v2/tools/${id}\""
          version="$(jq -r '.versions[0].id' "${body}")"
          check GET "/tools/${id}/versions/${version}/CWL/descriptor" 200 \
            '.content == "cwlVersion: v1.2"'
      - name: Show cluster state
        if: failure()
        run: |
          kubectl get all,configmaps,pvc,networkpolicies -n "${NAMESPACE}" || true
          kubectl describe pods -n "${NAMESPACE}" || true
          # The pods of the app and of MongoDB
          kubectl logs -n "${NAMESPACE}" --all-containers --prefix \
            -l app.kubernetes.io/instance=trs-filer --tail=100 || true
      - name: Tear down cluster
        if: always()
        run: kind delete cluster --name "${CLUSTER}"

  # The app as deployed with Docker Compose (image, Gunicorn, MongoDB): starts
  # it and checks the API (`test` covers the API in detail), the version and
  # the license text in the image
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API: http://localhost:8080/ga4gh/trs/v2
      # Passed to the image build by Docker Compose
      SETUPTOOLS_SCM_PRETEND_VERSION: 0.0.0+compose
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start app
        # Waits until the containers are healthy (see their health checks)
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Check API
        run: |
          body="${RUNNER_TEMP}/body.json"
          # Request a path, with an optional JSON body; check the status and
          # that the JSON response matches a jq filter
          check() {
            local method="$1" path="$2" status="$3" filter="$4" data="${5:-}" actual
            local args=(--silent --show-error --output "${body}"
              --write-out '%{http_code}' -X "${method}"
              --header 'Accept: application/json')
            if [ -n "${data}" ]; then
              args+=(--header 'Content-Type: application/json' --data "${data}")
            fi
            actual="$(curl "${args[@]}" "${API}${path}")"
            if [ "${actual}" != "${status}" ] \
                || ! jq -e "${filter}" "${body}" > /dev/null; then
              echo "::error::${method} ${path}: status ${actual}, expected ${status} and ${filter}"
              cat "${body}"
              return 1
            fi
          }
          check GET /service-info 200 '.type.artifact == "trs"'
          check GET /tools 200 '. == []'
          tool='{
            "name": "smoke",
            "organization": "Example",
            "toolclass": {"id": "smoke", "name": "Smoke", "description": "Smoke test"},
            "versions": [{
              "name": "v1",
              "is_production": false,
              "descriptor_type": ["CWL"],
              "files": [{
                "type": "CWL",
                "tool_file": {"file_type": "PRIMARY_DESCRIPTOR", "path": "main.cwl"},
                "file_wrapper": {"content": "cwlVersion: v1.2"}
              }, {
                "type": "CWL",
                "tool_file": {"file_type": "SECONDARY_DESCRIPTOR", "path": "tools/echo.cwl"},
                "file_wrapper": {"content": "class: CommandLineTool"}
              }]
            }]
          }'
          # Writes need a token of the (fictitious) identity provider of
          # `config.dev.yaml`
          check POST /tools 401 '.status == 401' "${tool}"
          check PUT /toolClasses/smoke 401 '.status == 401' '{"name": "Smoke"}'
          check DELETE /tools/SMOKE1 401 '.status == 401'
          # Writes without authentication (`config.noauth.yaml`, for local
          # development; see "Running without authentication" in
          # `docs/development.md`): restarts the app with it
          TRS_FILER_CONFIG_OVERLAY=/etc/trs-filer/config.dev.yaml:/etc/trs-filer/config.noauth.yaml \
            docker compose up -d --wait --wait-timeout 300
          check POST /tools 200 'type == "string"' "${tool}"
          id="$(jq -r . "${body}")"
          check GET "/tools/${id}" 200 \
            ".id == \"${id}\" and .name == \"smoke\" and (.versions | length) == 1"
          version="$(jq -r '.versions[0].id' "${body}")"
          check GET "/tools/${id}/versions/${version}/CWL/descriptor" 200 \
            '.content == "cwlVersion: v1.2"'
          # Files in subdirectories, by encoded and plain relative paths,
          # through Gunicorn, which decodes paths before routing
          for path in tools%2Fecho.cwl tools/echo.cwl; do
            check GET "/tools/${id}/versions/${version}/CWL/descriptor/${path}" 200 \
              '.content == "class: CommandLineTool"'
          done
          # Plain descriptors, as text
          plain="$(curl --silent --show-error --fail \
            --write-out '\n%{content_type}' \
            "${API}/tools/${id}/versions/${version}/PLAIN_CWL/descriptor")"
          if [ "${plain}" != $'cwlVersion: v1.2\ntext/plain; charset=utf-8' ]; then
            echo "::error::PLAIN_CWL descriptor: ${plain}"
            exit 1
          fi
          # Plain types aren't served as JSON (`check` accepts only JSON)
          check GET "/tools/${id}/versions/${version}/PLAIN_CWL/descriptor" 406 \
            '.status == 406'
          check GET /tools 200 "map(.id) == [\"${id}\"]"
          check GET /toolClasses 200 'map(.id) == ["smoke"]'
          check DELETE "/tools/${id}" 200 ". == \"${id}\""
          check GET "/tools/${id}" 404 '.status == 404'
      - name: Check app version
        run: |
          actual="$(docker compose exec -T trs-filer python -c \
            "from importlib.metadata import version; print(version('trs-filer'))")"
          if [ "${actual}" != "${SETUPTOOLS_SCM_PRETEND_VERSION}" ]; then
            echo "::error::App reports version '${actual}', expected '${SETUPTOOLS_SCM_PRETEND_VERSION}'"
            exit 1
          fi
      # No pip (whose vendored packages image scans report) and no uv in
      # the image, which installs packages in its build stages only
      - name: Check that image has no installer
        run: |
          docker compose exec -T --user 0 trs-filer sh -c '
            if command -v pip || command -v pip3 || command -v uv ||
              python -c "import pip" 2>/dev/null ||
              find / -xdev -name "pip-*.dist-info" | grep .; then
              exit 1
            fi'
      - name: Check license text in image
        run: |
          docker compose exec -T trs-filer python -c \
            "from importlib.metadata import distribution; \
            text = distribution('trs-filer').read_text('licenses/LICENSE'); \
            assert text and 'Apache License' in text, 'LICENSE missing'"
      - name: Show app logs
        if: failure()
        run: docker compose logs
      - name: Tear down app
        if: always()
        run: docker compose down --volumes

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Python version of Read the Docs (`.readthedocs.yaml`)
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # As in `lint`
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: uv.lock
      # The versions of `uv.lock`, as in `lint`
      - name: Install dependencies
        run: |
          uv sync --locked --extra docs --python "$(which python)"
          echo "${PWD}/.venv/bin" >> "$GITHUB_PATH"
      # Fails on warnings, e.g., of broken links, anchors and references
      - name: Build documentation
        run: mkdocs build --strict

  # The release workflow's checks of pins and curated notes, before the
  # immutable tag exists: for the version in `CITATION.cff` (set before a
  # release, see "Versioning and releases" in `docs/development.md`) while
  # it has no tag, or its tag is on this commit. On pull requests and in
  # forks, findings are warnings (so that they don't fail the gate). On
  # pushes to the upstream repository, findings fail the run, which the
  # release workflow requires to pass for the release commit; they also hold
  # back the `dev` image (`publish` needs this job) until they are fixed
  readiness:
    name: Release readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The scripts use the standard library only
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # In forks, findings are warnings too: forks often lack the upstream
      # repository's later tags, so released versions would look unreleased
      - name: Check pins and release notes
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          UPSTREAM: ${{ github.repository_owner == 'elixir-cloud-aai' }}
        run: |
          version="$(sed -En "s/^version:[[:space:]]*[\"']?([0-9A-Za-z.+-]+)[\"']?[[:space:]]*(#.*)?$/\1/p" CITATION.cff)"
          if [[ -z "${version}" ]]; then
              echo "No version in CITATION.cff: no release in preparation"
              exit 0
          fi
          # The commit of the (annotated) tag, if any: later commits are
          # skipped, but not the tagged commit itself (e.g., if it was
          # tagged before this job ran)
          tagged="$(git ls-remote origin "refs/tags/v${version}^{}" | cut -f1)"
          if [[ -n "${tagged}" && "${tagged}" != "${SHA}" ]]; then
              echo "v${version} is tagged: no release in preparation"
              exit 0
          fi
          level=error
          if [[ "${EVENT}" == "pull_request" || "${UPSTREAM}" != "true" ]]; then
              level=warning
          fi
          status=0
          python scripts/check_release_pins.py 2> pins.txt || status=1
          sed "s/^::error::/::${level}::/" pins.txt
          notes="docs/releases/${version}.md"
          if [[ -f "${notes}" ]]; then
              if grep -n "TODO" "${notes}"; then
                  echo "::${level}::${notes} contains TODO: finish the release notes before tagging v${version}"
                  status=1
              fi
              python scripts/release_notes.py check "${notes}" 2> notes.txt || status=1
              sed "s/^::error /::${level} /" notes.txt
          fi
          if [[ "${level}" == "error" ]]; then
              exit "${status}"
          fi

  # Builds the image and pushes it by digest only (untagged, with SBOM and
  # provenance attestations, `mode=max`), for `scan` to scan and `publish`
  # to sign and tag once all other jobs passed, as in `release.yml`. Runs
  # alongside the tests, so that the scan starts early; digests of runs that
  # fail (or fail the scan) are never signed or tagged, but stay on Docker
  # Hub, untagged (pullable by digest only). Pull requests (e.g., of
  # Dependabot and forks) and pushes in forks without `DOCKERHUB_ORG` get no
  # Docker Hub secrets and publish nothing; `scan` and the Compose build of
  # `smoke` build the image for them
  push:
    name: Push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The same expression as `PUBLISH` (`tests/test_workflows.py`)
    if: github.event_name == 'push' && (github.repository_owner == 'elixir-cloud-aai' || vars.DOCKERHUB_ORG != '')
    # Docker Hub secrets; the environment only allows branch `dev`
    environment: dev-images
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and tags, to derive the version
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # The Docker build gets no Git metadata, so the version (e.g.,
      # `0.3.1.dev4+g<commit>`) is passed as a build argument. It is derived
      # with the build requirements (`build-system.requires`, the dependency
      # group `build-system`), exported from `uv.lock` by the uv image of the
      # `Dockerfile` (pinned by digest, so that the uv binary is verified;
      # without network, as `--frozen` reads the lock only), then installed
      # at the exact versions of the lock, checked against its hashes, as
      # wheels only, into a virtual environment of their own (with the pip
      # of the runner's Python, `ensurepip`)
      - name: Derive version
        id: version
        run: |
          uv_image="$(sed -En 's/^FROM (ghcr\.io\/astral-sh\/uv:[^ @]+@sha256:[0-9a-f]{64}) AS uv$/\1/p' Dockerfile)"
          if [[ -z "${uv_image}" ]]; then
            echo "::error::No uv image pinned by digest in the Dockerfile"
            exit 1
          fi
          requirements="${RUNNER_TEMP}/build-requirements.txt"
          docker run --rm --network none --tmpfs /tmp --env UV_NO_CACHE=1 \
            --volume "${PWD}/pyproject.toml:/src/pyproject.toml:ro" \
            --volume "${PWD}/uv.lock:/src/uv.lock:ro" "${uv_image}" \
            export --frozen --only-group build-system --no-emit-project \
            --project /src > "${requirements}"
          python -m venv "${RUNNER_TEMP}/build-env"
          "${RUNNER_TEMP}/build-env/bin/pip" install --require-hashes \
            --only-binary :all: --no-deps -r "${requirements}"
          version="$("${RUNNER_TEMP}/build-env/bin/python" -m setuptools_scm)"
          echo "Version: ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # OCI labels with the version, commit and source; the tags are set by
      # `publish`, after the scan
      - name: Generate image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: type=raw,value=dev
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          labels: ${{ steps.meta.outputs.labels }}
          build-args: SETUPTOOLS_SCM_PRETEND_VERSION=${{ steps.version.outputs.version }}

  # Scans the image with Trivy (shared action
  # `elixir-cloud-aai/.github/actions/scan-image`): where `push` runs
  # (`PUBLISH`), exactly the digest that it pushed (`<image>@<digest>`;
  # public, so pulling it needs no login), otherwise (pull requests, forks
  # without `DOCKERHUB_ORG`) a local build; in a job without credentials or
  # signing permissions, as the Trivy action resolves the Trivy binary from a
  # mutable tag. The findings that have a fix are uploaded to code scanning
  # (only in this repository, and not for pull requests from forks, whose
  # token cannot write them), and the job fails on critical and high
  # vulnerabilities that have a fix. Accepted findings are listed, with a
  # reason and an expiry date, in `.trivyignore.yaml`. The release workflow
  # scans the release image the same way (`release.yml`), and `latest` is
  # scanned weekly (`scan.yml`)
  scan:
    name: Scan image
    # Skipped where `PUBLISH` is "false"
    needs: push
    if: ${{ !cancelled() && (needs.push.result == 'success' || needs.push.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        if: env.PUBLISH != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        if: env.PUBLISH != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          # Single image, for the local Docker daemon (no attestations)
          provenance: false
          # Named as the pushed image, so that code scanning matches the
          # findings of both
          tags: ${{ env.IMAGE_NAME }}:scan
      - name: Determine image
        id: image
        env:
          DIGEST: ${{ needs.push.outputs.digest }}
        run: |
          if [[ "${PUBLISH}" != "true" ]]; then
            echo "image=${IMAGE_NAME}:scan" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid image digest '${DIGEST}'"
            exit 1
          fi
          echo "image=${IMAGE_NAME}@${DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Scan image
        uses: elixir-cloud-aai/.github/actions/scan-image@743e82d290a53768454999e413756a924e383259 # v1.0.0
        with:
          image: ${{ steps.image.outputs.image }}
          category: image
          upload: ${{ github.repository_owner == 'elixir-cloud-aai' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}

  # Attests the build provenance of the scanned digest (GitHub artifact
  # attestation, also pushed to the registry), signs it with Sigstore keyless
  # signing (`cosign`, via the workflow's OIDC token) and only then tags
  # exactly that digest `dev` and `sha-<commit>` (never `latest`, which is
  # for releases), once all other jobs passed, so that the published image is
  # the scanned one; see "Verifying images and charts" in
  # `docs/operations.md`
  publish:
    name: Publish image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The same expression as `PUBLISH` (`tests/test_workflows.py`)
    if: github.event_name == 'push' && (github.repository_owner == 'elixir-cloud-aai' || vars.DOCKERHUB_ORG != '')
    needs: [lint, test, chart, chart-install, docs, readiness, smoke, push, scan]
    # Docker Hub secrets; the environment only allows branch `dev`
    environment: dev-images
    permissions:
      contents: read
      id-token: write # Sigstore signing certificates
      attestations: write # GitHub artifact attestations
    # Publish one image at a time, and only for the newest commit on the
    # branch, so that an older run cannot overwrite `dev` with older code
    concurrency:
      group: ${{ github.workflow }}-publish-${{ github.ref }}
      cancel-in-progress: false
    env:
      DIGEST: ${{ needs.push.outputs.digest }}
    steps:
      - name: Check that commit is still the branch head
        id: head
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          head=$(git ls-remote "https://github.com/${REPOSITORY}.git" "${REF}" | cut -f1)
          [ -n "${head}" ] || { echo "::error::Could not look up ${REF}"; exit 1; }
          if [ "${head}" = "${SHA}" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping publish: ${REF} has moved on to ${head}"
          fi
      - name: Check image digest
        if: steps.head.outputs.current == 'true'
        run: |
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid image digest '${DIGEST}'"
            exit 1
          fi
      - name: Set up Docker Buildx
        if: steps.head.outputs.current == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        if: steps.head.outputs.current == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Attest build provenance
        if: steps.head.outputs.current == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
          # No artifact metadata storage record (needs another permission)
          create-storage-record: false
      - name: Install cosign
        if: steps.head.outputs.current == 'true'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # The signature covers the digest, and so every tag of it
      - name: Sign image
        if: steps.head.outputs.current == 'true'
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"
      # Of the scanned and signed digest. A single source is copied as is;
      # `sha-<commit>` first, so that `dev` never moves to an image without
      # its commit tag
      - name: Tag image
        if: steps.head.outputs.current == 'true'
        env:
          SHA: ${{ github.sha }}
        run: |
          for tag in "${IMAGE_NAME}:sha-${SHA}" "${IMAGE_NAME}:dev"; do
            docker buildx imagetools create --tag "${tag}" "${IMAGE_NAME}@${DIGEST}"
            actual="$(docker buildx imagetools inspect "${tag}" \
              --format '{{ json .Manifest }}' | jq -r .digest)"
            if [[ "${actual}" != "${DIGEST}" ]]; then
              echo "::error::${tag} points to ${actual}, expected ${DIGEST}"
              exit 1
            fi
          done

  # Gate, the only check that the ruleset requires: fails if any other job
  # failed or was cancelled, or was skipped where it should have run. Only
  # `push` and `publish` may be skipped, where `PUBLISH` is "false" (pull
  # requests, and forks without `DOCKERHUB_ORG`). Every other job goes into
  # `needs` (see `tests/test_config.py`)
  passed:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [title, lint, test, chart, chart-install, docs, readiness, smoke, push, scan, publish]
    if: always()
    permissions: {}
    steps:
      - name: Check results of all jobs
        uses: elixir-cloud-aai/.github/actions/gate@743e82d290a53768454999e413756a924e383259 # v1.0.0
        with:
          needs: ${{ toJSON(needs) }}
          # Jobs that may be skipped: `title` on every event (on pushes and
          # for Dependabot), `push` and `publish` where they don't run (the
          # negation of their condition, `PUBLISH`)
          allow-skipped: >-
            ${{ format('title {0} {1}',
              !(github.event_name == 'push' && (github.repository_owner == 'elixir-cloud-aai' || vars.DOCKERHUB_ORG != '')) && 'push' || '',
              !(github.event_name == 'push' && (github.repository_owner == 'elixir-cloud-aai' || vars.DOCKERHUB_ORG != '')) && 'publish' || '') }}
