# Everything that must pass on pull requests and pushes to `dev`: lint,
# build, test, build the docs, run the app with Docker Compose, check the
# readiness of a release in preparation, scan the Docker image for known
# vulnerabilities, and, on pushes, push the Docker image by digest (with
# SBOM and provenance attestations), scan exactly that digest, then attest,
# sign (Sigstore) and tag it `dev` and `sha-<commit>` once all other jobs
# passed. Forks, which have none of the secrets, run the same checks
# without publishing, unless they set the repository variable
# `DOCKERHUB_ORG` to publish to their own organization.
# `github.repository_owner == 'elixir-cloud-aai'` marks runs of the upstream
# repository. The gate `passed` ("CI passed") is the only required check. No
# `paths:` filters, so that the gate always reports; skip jobs with `if:`
# instead (and allow the skip in the gate). Releases are published by
# `release.yml`, which requires a successful run of this workflow for the
# push of the release commit

name: CI
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

# Fully qualified (`docker.io/`), as the attestation needs it. The Docker Hub
# organization is the repository variable `DOCKERHUB_ORG` (by default
# `elixircloud`), as in `release.yml` and `scan.yml`, so that the scan job,
# which has no secrets, scans the image that is published
env:
  IMAGE_NAME: docker.io/${{ vars.DOCKERHUB_ORG || 'elixircloud' }}/trs-filer
  # "true" if this run publishes the image: pushes to this repository, or to
  # a fork that sets `DOCKERHUB_ORG` (and the Docker Hub secrets). Jobs' `if:`
  # can't read `env`, so `push` and `publish` repeat the expression
  # (`tests/test_workflows.py`)
  PUBLISH: ${{ github.event_name == 'push' && (github.repository_owner == 'elixir-cloud-aai' || vars.DOCKERHUB_ORG != '') }}

# Cancel superseded runs of a pull request; runs for pushes get their own
# group, so that queued runs for successive pushes are not dropped
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # All jobs use the Python version of the base image in the `Dockerfile`
      # (`requires-python` in `pyproject.toml`), the only one the app targets
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      # mypy checks imports, so runtime dependencies are needed too
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run linters, type checks and security checks
        run: |
          pre-commit run --all-files --show-diff-on-failure
          pre-commit run --all-files --hook-stage manual gitleaks-all
      # In its own environment, as cffconvert pins an old jsonschema; its
      # dependencies resolve within its own bounds. 2.0.0 is the latest stable
      # release (not bumped by Dependabot; update manually)
      - name: Validate citation metadata
        run: pipx run --spec cffconvert==2.0.0 cffconvert --validate -i CITATION.cff
      - name: Build distributions
        run: python -m build
      - name: Check wheel contents
        run: |
          unzip -Z1 dist/*.whl | tee wheel-contents.txt
          if grep -Ev '^trs_filer(/|-[^/]+\.dist-info/)' wheel-contents.txt; then
            echo "::error::Unexpected files in wheel"
            exit 1
          fi
          grep -qx 'trs_filer/config.yaml' wheel-contents.txt
          grep -Eqx 'trs_filer-[^/]+\.dist-info/licenses/LICENSE' wheel-contents.txt
          grep -q '^trs_filer/api/.*\.yaml$' wheel-contents.txt
  # The tests against mongomock (with coverage) and against MongoDB, the
  # database of deployments (`MONGODB_TEST_URI`, see `tests/conftest.py`), in
  # the version of `docker-compose.yaml` (MongoDB 8.0 refuses to start on some
  # kernels, see there)
  test:
    name: Test (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: mongomock
            image: ""
            uri: ""
          - database: MongoDB 7.0
            image: mongo:7.0
            uri: mongodb://localhost:27017
    services:
      # Not started for an empty image (the `mongomock` entry)
      mongodb:
        image: ${{ matrix.image }}
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MONGODB_TEST_URI: ${{ matrix.uri }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Calculate unit test coverage
        if: ${{ matrix.uri == '' }}
        run: |
          coverage run -m pytest -W ignore::DeprecationWarning
          coverage xml
      # Upload errors fail the workflow only on branch pushes to the upstream
      # repository: pull requests from forks and Dependabot, and pushes in
      # forks, have no access to its Codecov token (so failures are
      # deliberately non-fatal there), and release tags shouldn't fail for
      # Codecov outages
      - name: Submit Report to Codecov
        if: ${{ matrix.uri == '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.repository_owner == 'elixir-cloud-aai' }}
          verbose: true
      # `tests/test_fixtures.py` checks that the tests use the MongoDB
      - name: Run tests against MongoDB
        if: ${{ matrix.uri != '' }}
        run: pytest -W ignore::DeprecationWarning

  # The app as deployed with Docker Compose (image, Gunicorn, MongoDB): starts
  # it and checks the API (`test` covers the API in detail), the version and
  # the license text in the image
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API: http://localhost:8080/ga4gh/trs/v2
      # Passed to the image build by Docker Compose
      SETUPTOOLS_SCM_PRETEND_VERSION: 0.0.0+compose
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start app
        # Waits until the containers are healthy (see their health checks)
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Check API
        run: |
          body="${RUNNER_TEMP}/body.json"
          # Request a path, with an optional JSON body; check the status and
          # that the JSON response matches a jq filter
          check() {
            local method="$1" path="$2" status="$3" filter="$4" data="${5:-}" actual
            local args=(--silent --show-error --output "${body}"
              --write-out '%{http_code}' -X "${method}"
              --header 'Accept: application/json')
            if [ -n "${data}" ]; then
              args+=(--header 'Content-Type: application/json' --data "${data}")
            fi
            actual="$(curl "${args[@]}" "${API}${path}")"
            if [ "${actual}" != "${status}" ] \
                || ! jq -e "${filter}" "${body}" > /dev/null; then
              echo "::error::${method} ${path}: status ${actual}, expected ${status} and ${filter}"
              cat "${body}"
              return 1
            fi
          }
          check GET /service-info 200 '.type.artifact == "trs"'
          check GET /tools 200 '. == []'
          tool='{
            "name": "smoke",
            "organization": "Example",
            "toolclass": {"id": "smoke", "name": "Smoke", "description": "Smoke test"},
            "versions": [{
              "name": "v1",
              "is_production": false,
              "descriptor_type": ["CWL"],
              "files": [{
                "type": "CWL",
                "tool_file": {"file_type": "PRIMARY_DESCRIPTOR", "path": "main.cwl"},
                "file_wrapper": {"content": "cwlVersion: v1.2"}
              }]
            }]
          }'
          check POST /tools 200 'type == "string"' "${tool}"
          id="$(jq -r . "${body}")"
          check GET "/tools/${id}" 200 \
            ".id == \"${id}\" and .name == \"smoke\" and (.versions | length) == 1"
          version="$(jq -r '.versions[0].id' "${body}")"
          check GET "/tools/${id}/versions/${version}/CWL/descriptor" 200 \
            '.content == "cwlVersion: v1.2"'
          check GET /tools 200 "map(.id) == [\"${id}\"]"
          check GET /toolClasses 200 'map(.id) == ["smoke"]'
          check DELETE "/tools/${id}" 200 ". == \"${id}\""
          check GET "/tools/${id}" 404 '.status == 404'
      - name: Check app version
        run: |
          actual="$(docker compose exec -T trs-filer python -c \
            "from importlib.metadata import version; print(version('trs-filer'))")"
          if [ "${actual}" != "${SETUPTOOLS_SCM_PRETEND_VERSION}" ]; then
            echo "::error::App reports version '${actual}', expected '${SETUPTOOLS_SCM_PRETEND_VERSION}'"
            exit 1
          fi
      - name: Check license text in image
        run: |
          docker compose exec -T trs-filer python -c \
            "from importlib.metadata import distribution; \
            text = distribution('trs-filer').read_text('licenses/LICENSE'); \
            assert text and 'Apache License' in text, 'LICENSE missing'"
      - name: Show app logs
        if: failure()
        run: docker compose logs
      - name: Tear down app
        if: always()
        run: docker compose down --volumes

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Python version of Read the Docs (`.readthedocs.yaml`)
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[docs]"
      # Fails on warnings, e.g., of broken links, anchors and references
      - name: Build documentation
        run: mkdocs build --strict

  # The release workflow's checks of pins and curated notes, before the
  # immutable tag exists: for the version in `CITATION.cff` (set before a
  # release, see "Versioning and releases" in `docs/development.md`) while
  # it has no tag, or its tag is on this commit. On pull requests and in
  # forks, findings are warnings (so that they don't fail the gate). On
  # pushes to the upstream repository, findings fail the run, which the
  # release workflow requires to pass for the release commit; they also hold
  # back the `dev` image (`publish` needs this job) until they are fixed
  readiness:
    name: Release readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The scripts use the standard library only
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # In forks, findings are warnings too: forks often lack the upstream
      # repository's later tags, so released versions would look unreleased
      - name: Check pins and release notes
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          UPSTREAM: ${{ github.repository_owner == 'elixir-cloud-aai' }}
        run: |
          version="$(sed -En "s/^version:[[:space:]]*[\"']?([0-9A-Za-z.+-]+)[\"']?[[:space:]]*(#.*)?$/\1/p" CITATION.cff)"
          if [[ -z "${version}" ]]; then
              echo "No version in CITATION.cff: no release in preparation"
              exit 0
          fi
          # The commit of the (annotated) tag, if any: later commits are
          # skipped, but not the tagged commit itself (e.g., if it was
          # tagged before this job ran)
          tagged="$(git ls-remote origin "refs/tags/v${version}^{}" | cut -f1)"
          if [[ -n "${tagged}" && "${tagged}" != "${SHA}" ]]; then
              echo "v${version} is tagged: no release in preparation"
              exit 0
          fi
          level=error
          if [[ "${EVENT}" == "pull_request" || "${UPSTREAM}" != "true" ]]; then
              level=warning
          fi
          status=0
          python scripts/check_release_pins.py 2> pins.txt || status=1
          sed "s/^::error::/::${level}::/" pins.txt
          notes="docs/releases/${version}.md"
          if [[ -f "${notes}" ]]; then
              if grep -n "TODO" "${notes}"; then
                  echo "::${level}::${notes} contains TODO: finish the release notes before tagging v${version}"
                  status=1
              fi
              python scripts/release_notes.py check "${notes}" 2> notes.txt || status=1
              sed "s/^::error /::${level} /" notes.txt
          fi
          if [[ "${level}" == "error" ]]; then
              exit "${status}"
          fi

  # Builds the image and pushes it by digest only (untagged, with SBOM and
  # provenance attestations, `mode=max`), for `scan` to scan and `publish`
  # to sign and tag once all other jobs passed, as in `release.yml`. Runs
  # alongside the tests, so that the scan starts early; digests of runs that
  # fail (or fail the scan) are never signed or tagged, but stay on Docker
  # Hub, untagged (pullable by digest only). Pull requests (e.g., of
  # Dependabot and forks) and pushes in forks without `DOCKERHUB_ORG` get no
  # Docker Hub secrets and publish nothing; `scan` and the Compose build of
  # `smoke` build the image for them
  push:
    name: Push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The same expression as `PUBLISH` (`tests/test_workflows.py`)
    if: github.event_name == 'push' && (github.repository_owner == 'elixir-cloud-aai' || vars.DOCKERHUB_ORG != '')
    # Docker Hub secrets; the environment only allows branch `dev`
    environment: dev-images
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and tags, to derive the version
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # The Docker build gets no Git metadata, so the version (e.g.,
      # `0.3.1.dev4+g<commit>`) is passed as a build argument
      - name: Derive version
        id: version
        # Same bound as in `build-system.requires` of `pyproject.toml`
        run: |
          pip install "setuptools-scm>=8"
          echo "version=$(python -m setuptools_scm)" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # OCI labels with the version, commit and source; the tags are set by
      # `publish`, after the scan
      - name: Generate image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: type=raw,value=dev
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          labels: ${{ steps.meta.outputs.labels }}
          build-args: SETUPTOOLS_SCM_PRETEND_VERSION=${{ steps.version.outputs.version }}

  # Scans the image with Trivy (shared action
  # `elixir-cloud-aai/.github/actions/scan-image`): where `push` runs
  # (`PUBLISH`), exactly the digest that it pushed (`<image>@<digest>`;
  # public, so pulling it needs no login), otherwise (pull requests, forks
  # without `DOCKERHUB_ORG`) a local build; in a job without credentials or
  # signing permissions, as the Trivy action resolves the Trivy binary from a
  # mutable tag. The findings that have a fix are uploaded to code scanning
  # (only in this repository, and not for pull requests from forks, whose
  # token cannot write them), and the job fails on critical and high
  # vulnerabilities that have a fix. Accepted findings are listed, with a
  # reason and an expiry date, in `.trivyignore.yaml`. The release workflow
  # scans the release image the same way (`release.yml`), and `latest` is
  # scanned weekly (`scan.yml`)
  scan:
    name: Scan image
    # Skipped where `PUBLISH` is "false"
    needs: push
    if: ${{ !cancelled() && (needs.push.result == 'success' || needs.push.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        if: env.PUBLISH != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        if: env.PUBLISH != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          # Single image, for the local Docker daemon (no attestations)
          provenance: false
          # Named as the pushed image, so that code scanning matches the
          # findings of both
          tags: ${{ env.IMAGE_NAME }}:scan
      - name: Determine image
        id: image
        env:
          DIGEST: ${{ needs.push.outputs.digest }}
        run: |
          if [[ "${PUBLISH}" != "true" ]]; then
            echo "image=${IMAGE_NAME}:scan" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid image digest '${DIGEST}'"
            exit 1
          fi
          echo "image=${IMAGE_NAME}@${DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Scan image
        uses: elixir-cloud-aai/.github/actions/scan-image@743e82d290a53768454999e413756a924e383259 # v1.0.0
        with:
          image: ${{ steps.image.outputs.image }}
          category: image
          upload: ${{ github.repository_owner == 'elixir-cloud-aai' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}

  # Attests the build provenance of the scanned digest (GitHub artifact
  # attestation, also pushed to the registry), signs it with Sigstore keyless
  # signing (`cosign`, via the workflow's OIDC token) and only then tags
  # exactly that digest `dev` and `sha-<commit>` (never `latest`, which is
  # for releases), once all other jobs passed, so that the published image is
  # the scanned one; see "Verifying images and charts" in
  # `docs/operations.md`
  publish:
    name: Publish image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The same expression as `PUBLISH` (`tests/test_workflows.py`)
    if: github.event_name == 'push' && (github.repository_owner == 'elixir-cloud-aai' || vars.DOCKERHUB_ORG != '')
    needs: [lint, test, docs, readiness, smoke, push, scan]
    # Docker Hub secrets; the environment only allows branch `dev`
    environment: dev-images
    permissions:
      contents: read
      id-token: write # Sigstore signing certificates
      attestations: write # GitHub artifact attestations
    # Publish one image at a time, and only for the newest commit on the
    # branch, so that an older run cannot overwrite `dev` with older code
    concurrency:
      group: ${{ github.workflow }}-publish-${{ github.ref }}
      cancel-in-progress: false
    env:
      DIGEST: ${{ needs.push.outputs.digest }}
    steps:
      - name: Check that commit is still the branch head
        id: head
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          head=$(git ls-remote "https://github.com/${REPOSITORY}.git" "${REF}" | cut -f1)
          [ -n "${head}" ] || { echo "::error::Could not look up ${REF}"; exit 1; }
          if [ "${head}" = "${SHA}" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping publish: ${REF} has moved on to ${head}"
          fi
      - name: Check image digest
        if: steps.head.outputs.current == 'true'
        run: |
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid image digest '${DIGEST}'"
            exit 1
          fi
      - name: Set up Docker Buildx
        if: steps.head.outputs.current == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        if: steps.head.outputs.current == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Attest build provenance
        if: steps.head.outputs.current == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
          # No artifact metadata storage record (needs another permission)
          create-storage-record: false
      - name: Install cosign
        if: steps.head.outputs.current == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # The signature covers the digest, and so every tag of it
      - name: Sign image
        if: steps.head.outputs.current == 'true'
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"
      # Of the scanned and signed digest. A single source is copied as is;
      # `sha-<commit>` first, so that `dev` never moves to an image without
      # its commit tag
      - name: Tag image
        if: steps.head.outputs.current == 'true'
        env:
          SHA: ${{ github.sha }}
        run: |
          for tag in "${IMAGE_NAME}:sha-${SHA}" "${IMAGE_NAME}:dev"; do
            docker buildx imagetools create --tag "${tag}" "${IMAGE_NAME}@${DIGEST}"
            actual="$(docker buildx imagetools inspect "${tag}" \
              --format '{{ json .Manifest }}' | jq -r .digest)"
            if [[ "${actual}" != "${DIGEST}" ]]; then
              echo "::error::${tag} points to ${actual}, expected ${DIGEST}"
              exit 1
            fi
          done

  # Gate, the only check that the ruleset requires: fails if any other job
  # failed or was cancelled, or was skipped where it should have run. Only
  # `push` and `publish` may be skipped, where `PUBLISH` is "false" (pull
  # requests, and forks without `DOCKERHUB_ORG`). Every other job goes into
  # `needs` (see `tests/test_config.py`)
  passed:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, test, docs, readiness, smoke, push, scan, publish]
    if: always()
    permissions: {}
    steps:
      - name: Check results of all jobs
        uses: elixir-cloud-aai/.github/actions/gate@743e82d290a53768454999e413756a924e383259 # v1.0.0
        with:
          needs: ${{ toJSON(needs) }}
          # Jobs that may be skipped: `push` and `publish` where they don't
          # run (the negation of their condition, `PUBLISH`)
          allow-skipped: >-
            ${{ format('{0} {1}',
              !(github.event_name == 'push' && (github.repository_owner == 'elixir-cloud-aai' || vars.DOCKERHUB_ORG != '')) && 'push' || '',
              !(github.event_name == 'push' && (github.repository_owner == 'elixir-cloud-aai' || vars.DOCKERHUB_ORG != '')) && 'publish' || '') }}
