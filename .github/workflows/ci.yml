# Everything that must pass on pull requests and pushes: lints, builds and
# tests the project (also for release tags), checks the dependency pins of
# release tags, and publishes the image for pushes of `dev` of the upstream
# repository (forks have no Docker Hub secrets, so their CI publishes
# nothing). The ruleset is to require the gate `CI passed` only

name: CI
on:
  push:
    branches: [dev]
    # Release tags (also pre-releases), for the `pins` job
    tags: ["v*"]
  pull_request:
    branches: [dev]

permissions:
  contents: read

# Cancel superseded runs of a pull request; runs for pushes get their own
# group (per ref, as a tag may point to a commit of `dev`), so that queued
# runs for successive pushes are not dropped
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && format('{0}-{1}', github.ref, github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # All jobs use the Python version of the base image in the `Dockerfile`
      # (`requires-python` in `pyproject.toml`), the only one the app targets
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      # mypy checks imports, so runtime dependencies are needed too
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run linters, type checks and security checks
        run: |
          pre-commit run --all-files --show-diff-on-failure
          pre-commit run --all-files --hook-stage manual gitleaks-all
      - name: Build distributions
        run: python -m build
      - name: Check wheel contents
        run: |
          unzip -Z1 dist/*.whl | tee wheel-contents.txt
          if grep -Ev '^trs_filer(/|-[^/]+\.dist-info/)' wheel-contents.txt; then
            echo "::error::Unexpected files in wheel"
            exit 1
          fi
          grep -qx 'trs_filer/config.yaml' wheel-contents.txt
          grep -Eqx 'trs_filer-[^/]+\.dist-info/licenses/LICENSE' wheel-contents.txt
          grep -q '^trs_filer/api/.*\.yaml$' wheel-contents.txt
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Passed to the image build by Docker Compose
      SETUPTOOLS_SCM_PRETEND_VERSION: 0.0.0+compose
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Calculate unit test coverage
        run: |
          coverage run -m pytest -W ignore::DeprecationWarning
          coverage xml
      # Upload errors fail the workflow only on branch pushes to the upstream
      # repository: pull requests from forks and Dependabot, and pushes in
      # forks, have no access to its Codecov token (so failures are
      # deliberately non-fatal there), and release tags shouldn't fail for
      # Codecov outages
      - name: Submit Report to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.repository_owner == 'elixir-cloud-aai' }}
          verbose: true
      - name: Deploy app
        # Waits until the containers are healthy (see their health checks)
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Run integration tests
        run: pytest tests/integration_tests.py
      - name: Check app version
        run: |
          actual="$(docker compose exec -T trs-filer python -c \
            "from importlib.metadata import version; print(version('trs-filer'))")"
          if [ "${actual}" != "${SETUPTOOLS_SCM_PRETEND_VERSION}" ]; then
            echo "::error::App reports version '${actual}', expected '${SETUPTOOLS_SCM_PRETEND_VERSION}'"
            exit 1
          fi
      - name: Check license text in image
        run: |
          docker compose exec -T trs-filer python -c \
            "from importlib.metadata import distribution; \
            text = distribution('trs-filer').read_text('licenses/LICENSE'); \
            assert text and 'Apache License' in text, 'LICENSE missing'"
      - name: Show app logs
        if: failure()
        run: docker compose logs
      - name: Tear down app
        if: always()
        run: docker compose down

  # Checks that release tags pin released versions of the dependencies only
  # (`scripts/check_release_pins.py`), e.g., no FOCA commit or development
  # image, before a GitHub release is published from the tag. Release tags
  # only, as `dev` may pin development versions. To be replaced by a step of
  # the release workflow (#133)
  pins:
    name: Release pins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Same condition as the `pins` skip allowed by the gate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The script uses the standard library only
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Check that dependencies are releases
        run: python scripts/check_release_pins.py

  # TEMPORARY: replaced by the release and supply-chain workflows (#133,
  # #134). Pushes of the default branch of the upstream repository only:
  # pull requests (e.g., of Dependabot and forks) and pushes in forks get no
  # Docker Hub secrets, and the Compose build of `test` builds the image for
  # them
  publish:
    name: Publish image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, test]
    # Same condition as the `publish` skip allowed by the gate
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.repository_owner == 'elixir-cloud-aai'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and tags, to derive the version
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # The Docker build gets no Git metadata, so the version (e.g.,
      # `0.3.1.dev4+g<commit>`) is passed as a build argument
      - name: Derive version
        id: version
        # Same bound as in `build-system.requires` of `pyproject.toml`
        run: |
          pip install "setuptools-scm>=8"
          echo "version=$(python -m setuptools_scm)" >> "$GITHUB_OUTPUT"
      # Tags `latest` (pushed) and the date (local only), as before
      - name: Build & Publish image to DockerHub
        env:
          DOCKERHUB_ORG: ${{ vars.DOCKERHUB_ORG || 'elixircloud' }}
          DOCKERHUB_LOGIN: ${{ secrets.DOCKERHUB_LOGIN }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REPO_NAME: ${{ github.event.repository.name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          image="${DOCKERHUB_ORG}/${REPO_NAME}"
          docker build . \
            --build-arg "SETUPTOOLS_SCM_PRETEND_VERSION=${VERSION}" \
            -t "${image}:latest" \
            -t "${image}:$(date '+%Y%m%d')"
          echo "${DOCKERHUB_TOKEN}" | \
            docker login -u "${DOCKERHUB_LOGIN}" --password-stdin
          docker push "${image}:latest"
          rm "${HOME}/.docker/config.json"  # delete token

  # Gate, the only check that the ruleset requires: fails if any other job
  # failed or was cancelled, or was skipped where it should have run. Only
  # `pins` (except for release tags) and `publish` (except for pushes of the
  # default branch of the upstream repository) may be skipped. Every other
  # job goes into `needs` (see `tests/test_config.py`)
  passed:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, test, pins, publish]
    if: always()
    permissions: {}
    steps:
      - name: Check results of all jobs
        uses: elixir-cloud-aai/.github/actions/gate@743e82d290a53768454999e413756a924e383259 # v1.0.0
        with:
          needs: ${{ toJSON(needs) }}
          # Jobs that may be skipped: `pins` except on version tags, `publish`
          # except on pushes to the default branch of the upstream repository
          allow-skipped: >-
            ${{ format('{0} {1}',
              !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) && 'pins' || '',
              !(github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.repository_owner == 'elixir-cloud-aai') && 'publish' || '') }}
