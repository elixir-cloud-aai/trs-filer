# This workflow will build the project, lint, run tests, and build and push
# Docker images.

name: CI
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

# Cancel superseded runs of a pull request; runs for pushes get their own
# group, so that queued runs for successive pushes are not dropped
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  Test:
    name: Run linting, unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Passed to the image build by Docker Compose
      SETUPTOOLS_SCM_PRETEND_VERSION: 0.0.0+compose
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Python version of the base image in the `Dockerfile`
      # (`requires-python` in `pyproject.toml`), the only one the app targets
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint with flake8
        run: flake8
      - name: Build distributions
        run: python -m build
      - name: Check wheel contents
        run: |
          unzip -Z1 dist/*.whl | tee wheel-contents.txt
          if grep -Ev '^trs_filer(/|-[^/]+\.dist-info/)' wheel-contents.txt; then
            echo "::error::Unexpected files in wheel"
            exit 1
          fi
          grep -qx 'trs_filer/config.yaml' wheel-contents.txt
          grep -Eqx 'trs_filer-[^/]+\.dist-info/licenses/LICENSE' wheel-contents.txt
          grep -q '^trs_filer/api/.*\.yaml$' wheel-contents.txt
      - name: Calculate unit test coverage
        run: |
          coverage run -m pytest -W ignore::DeprecationWarning
          coverage xml
      # Upload errors fail the workflow only on pushes, because pull requests
      # from forks and Dependabot get no access to the Codecov token
      - name: Submit Report to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: ${{ github.event_name == 'push' }}
          verbose: true
      - name: Deploy app
        # Waits until the containers are healthy (see their health checks)
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Run integration tests
        run: pytest tests/integration_tests.py
      - name: Check app version
        run: |
          actual="$(docker compose exec -T trs-filer python -c \
            "from importlib.metadata import version; print(version('trs-filer'))")"
          if [ "${actual}" != "${SETUPTOOLS_SCM_PRETEND_VERSION}" ]; then
            echo "::error::App reports version '${actual}', expected '${SETUPTOOLS_SCM_PRETEND_VERSION}'"
            exit 1
          fi
      - name: Check license text in image
        run: |
          docker compose exec -T trs-filer python -c \
            "from importlib.metadata import distribution; \
            text = distribution('trs-filer').read_text('licenses/LICENSE'); \
            assert text and 'Apache License' in text, 'LICENSE missing'"
      - name: Show app logs
        if: failure()
        run: docker compose logs
      - name: Tear down app
        if: always()
        run: docker compose down

  # TEMPORARY: replaced by the release and supply-chain workflows (#133,
  # #134). Pushes of the default branch only: pull requests get no Docker
  # Hub secrets (e.g., of Dependabot and forks), and the Compose build of
  # `Test` builds the image for them
  Publish:
    name: Build and publish app image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [Test]
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and tags, to derive the version
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # The Docker build gets no Git metadata, so the version (e.g.,
      # `0.3.1.dev4+g<commit>`) is passed as a build argument
      - name: Derive version
        id: version
        # Same bound as in `build-system.requires` of `pyproject.toml`
        run: |
          pip install "setuptools-scm>=8"
          echo "version=$(python -m setuptools_scm)" >> "$GITHUB_OUTPUT"
      # Tags `latest` (pushed) and the date (local only), as before
      - name: Build & Publish image to DockerHub
        env:
          DOCKERHUB_ORG: ${{ secrets.DOCKERHUB_ORG }}
          DOCKERHUB_LOGIN: ${{ secrets.DOCKERHUB_LOGIN }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REPO_NAME: ${{ github.event.repository.name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          image="${DOCKERHUB_ORG}/${REPO_NAME}"
          docker build . \
            --build-arg "SETUPTOOLS_SCM_PRETEND_VERSION=${VERSION}" \
            -t "${image}:latest" \
            -t "${image}:$(date '+%Y%m%d')"
          echo "${DOCKERHUB_TOKEN}" | \
            docker login -u "${DOCKERHUB_LOGIN}" --password-stdin
          docker push "${image}:latest"
          rm "${HOME}/.docker/config.json"  # delete token
