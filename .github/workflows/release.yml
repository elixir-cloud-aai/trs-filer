# Release when a version tag (`vX.Y.Z`, or `vX.Y.ZaN`, `vX.Y.ZbN`,
# `vX.Y.ZrcN` for pre-releases) is pushed: check the tag and that CI passed
# for its commit, package the Helm chart (`prepare`), build and push the
# Docker image by digest, untagged, and check it (`push`), and only then tag
# exactly that digest and create the GitHub release with the chart attached
# (`publish`). `push` and `publish` each need approval in the `release`
# environment. Re-running all jobs builds and tags a new digest; re-running
# failed jobs reuses the digest already pushed. The tag is the only source of
# the version: it is passed to the image build (the Docker build gets no Git
# metadata) and set as the chart's `version` and `appVersion` and as the tag
# of its default image. Release notes are the curated
# `docs/releases/<version>.md` followed by GitHub's generated notes if the
# former exists (the run fails if it contains `TODO` or is not in the agreed
# format, see `scripts/release_notes.py`), otherwise the generated notes
# alone; add curated notes to the `nav` of `mkdocs.yml` too (the docs build
# fails otherwise).
# Publishing runs in the `release` environment (required reviewer, Docker
# Hub secrets). Release tags are immutable (tag ruleset). See "Versioning
# and releases" in `docs/development.md`. Until 1.0.0, all releases are GitHub
# pre-releases (but stable ones still update the `latest` image).

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Fully qualified (`docker.io/`). The Docker Hub organization is the
# repository variable `DOCKERHUB_ORG` (by default `elixircloud`), as in
# `ci.yml`
env:
  IMAGE_NAME: docker.io/${{ vars.DOCKERHUB_ORG || 'elixircloud' }}/trs-filer

# One run per tag, so that a run waiting for approval is not cancelled by
# the run of another tag; `latest` is decided at the end of each run, from
# freshly fetched tags on `main`
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # read the CI runs of the release commit
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and all tags, to check that the release commit is on
          # `main`
          fetch-depth: 0
      # For `scripts/release_version.py`, `scripts/citation.py`,
      # `scripts/check_release_pins.py` and `scripts/chart_readme.py`
      # (standard library only); the Python version of `ci.yml`
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Check release tag and commit
        id: version
        # Guards against accidental releases, e.g., of unmerged commits; the
        # `release` environment's protection rules (required reviewer) are
        # what actually control publishing
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # Fails unless the tag is a release version; version, chart version
          # and kind of release (see `scripts/release_version.py`)
          python scripts/release_version.py outputs "${TAG}" >> "${GITHUB_OUTPUT}"
          # Annotated, with a signature that GitHub verified
          if [[ "$(git cat-file -t "refs/tags/${TAG}")" != "tag" ]]; then
              echo "::error::Tag '${TAG}' is not annotated (git tag -s)"
              exit 1
          fi
          verified="$(gh api "repos/${REPOSITORY}/git/tags/$(git rev-parse "refs/tags/${TAG}")" \
              --jq .verification.verified)"
          if [[ "${verified}" != "true" ]]; then
              echo "::error::Tag '${TAG}' has no signature verified by GitHub (git tag -s)"
              exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::error::Release commit is not on 'main'"
              exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
      # Zenodo archives the release with the citation metadata of the tagged
      # commit, so they must have the release version (see "Versioning and
      # releases" in `docs/development.md`)
      - name: Check citation metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python scripts/citation.py check "${VERSION}"
      # Curated release notes are published as written, so unfinished ones
      # (with a `TODO`) must not be published, nor ones that are not in the
      # agreed format (`scripts/release_notes.py`)
      - name: Check release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes="docs/releases/${VERSION}.md"
          if [[ -f "${notes}" ]]; then
              if grep -n "TODO" "${notes}"; then
                  echo "::error::${notes} contains TODO: finish the release notes, then tag a new release"
                  exit 1
              fi
              python scripts/release_notes.py check "${notes}"
          fi
      # Temporary pins to development versions (e.g., a FOCA commit, to test
      # unreleased changes) must be replaced by releases first; this applies
      # to every tag, pre-releases included
      - name: Check that dependencies are releases
        run: python scripts/check_release_pins.py
      # The checks above don't run the tests: require a successful run of
      # the CI workflow for a push of the release commit (to `dev`, before it
      # moved to `main`); runs for pull requests test merge commits, not the
      # commit itself. Re-runs that succeeded count
      - name: Check that CI passed for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          runs="$(gh api "repos/${REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&event=push&status=success&per_page=1" \
              --jq .total_count)"
          if [[ ! "${runs}" =~ ^[0-9]+$ || "${runs}" -lt 1 ]]; then
              echo "::error::No successful run of the CI workflow (ci.yml) for a push of ${SHA}; once CI passed for it (re-run it if it failed or was cancelled), re-run this workflow"
              exit 1
          fi
      # Dependabot updates the action, but not this version: bump it by hand
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1
      # `version` and `appVersion` are the release version (the chart
      # version in its SemVer form). The chart is packaged from a copy whose
      # default image is the release image (`trs_filer.image`, which names its
      # tag, by default `latest`), also in forks that publish to another
      # organization (`DOCKERHUB_ORG`), and whose README links to the docs and
      # files of the release instead of the latest docs and branch `dev` (see
      # `scripts/chart_readme.py`; fails if any link to a version that moves
      # is left)
      - name: Package chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHART_VERSION: ${{ steps.version.outputs.chart_version }}
        run: |
          chart="$(mktemp -d)/trs-filer"
          cp -R deployment "${chart}"
          image="${IMAGE_NAME#docker.io/}:${VERSION}"
          IMAGE="${image}" yq -i '.trs_filer.image = strenv(IMAGE)' "${chart}/values.yaml"
          python scripts/chart_readme.py "${chart}/README.md" "v${VERSION}"
          helm lint "${chart}" --strict
          helm package "${chart}" \
              --version "${CHART_VERSION}" --app-version "${VERSION}" -d dist
          package="dist/trs-filer-${CHART_VERSION}.tgz"
          # The packaged README is the checked one, and the default image is
          # the release image
          tar -xzOf "${package}" trs-filer/README.md | cmp - "${chart}/README.md"
          [[ "$(tar -xzOf "${package}" trs-filer/values.yaml | yq .trs_filer.image)" \
              == "${image}" ]]
      - name: Upload chart
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart
          path: dist/
          if-no-files-found: error
          # Re-runs of all jobs replace the chart of the earlier attempt
          overwrite: true

  # Builds the image of the release commit once and pushes it by digest only
  # (untagged), for `publish` to tag; checks that the app reports the release
  # version. Digests of runs that fail are never tagged, but stay on Docker
  # Hub, untagged (pullable by digest only)
  push:
    name: Push release image
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Docker Hub secrets (required reviewer)
    environment: release
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      # The commit checked by `prepare`; release tags cannot be moved (tag
      # ruleset)
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # OCI labels with the version, commit and source; `tags` only sets the
      # version label (the image is tagged by digest in `publish`)
      - name: Generate image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: type=raw,value=${{ needs.prepare.outputs.version }}
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: SETUPTOOLS_SCM_PRETEND_VERSION=${{ needs.prepare.outputs.version }}
      - name: Check app version of image
        env:
          IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
        run: |
          actual="$(docker run --rm --entrypoint python "${IMAGE}" \
              -c "from importlib.metadata import version; print(version('trs-filer'))")"
          if [[ "${actual}" != "${VERSION}" ]]; then
              echo "::error::Image reports version '${actual}', expected '${VERSION}'"
              exit 1
          fi

  publish:
    name: Publish release
    needs: [prepare, push]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write # create the GitHub release
      pull-requests: read # list the pull requests of a first release
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      DIGEST: ${{ needs.push.outputs.digest }}
    steps:
      # The commit checked by `prepare`; release tags cannot be moved (tag
      # ruleset)
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
          # All tags and `main`, to determine the highest release
          fetch-depth: 0
      # For `scripts/release_version.py`, `scripts/release_notes.py` and
      # `scripts/release_assets.py` (standard library only); the Python
      # version of `ci.yml`
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Check image digest
        run: |
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Invalid image digest '${DIGEST}'"
              exit 1
          fi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Download chart
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chart
          path: dist/
      # Decided last, from freshly fetched tags (the repository is public, so
      # no credentials are needed), so that neither a re-run of an older
      # release nor a concurrent release moves `latest` back
      - name: Check whether this is the highest release
        id: latest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --quiet --force --tags origin \
              "+refs/heads/main:refs/remotes/origin/main"
          # The highest stable release among the tags on `main`, so that stray
          # tags are ignored
          git tag -l 'v*' --merged origin/main \
              | python scripts/release_version.py latest "${TAG}" >> "${GITHUB_OUTPUT}"
      # Tags `X.Y.Z` (and `latest`) point to the pushed and checked digest: a
      # single source is copied as is
      - name: Tag image
        env:
          LATEST: ${{ steps.latest.outputs.latest }}
        run: |
          tags=("${IMAGE_NAME}:${VERSION}")
          if [[ "${LATEST}" == "true" ]]; then
              tags+=("${IMAGE_NAME}:latest")
          fi
          for tag in "${tags[@]}"; do
              docker buildx imagetools create --tag "${tag}" "${IMAGE_NAME}@${DIGEST}"
              actual="$(docker buildx imagetools inspect "${tag}" \
                  --format '{{ json .Manifest }}' | jq -r .digest)"
              if [[ "${actual}" != "${DIGEST}" ]]; then
                  echo "::error::${tag} points to ${actual}, expected ${DIGEST}"
                  exit 1
              fi
          done
      # GitHub's generated notes list the merged pull requests since the
      # previous release in the history of the release commit (see
      # `scripts/release_version.py`), or since the start for the first
      # release (see "Create release"). Only tags with a published GitHub
      # release count, so that the changes of a tag whose release failed (and
      # was replaced by a new patch version) are listed in the next release.
      # The script filters the tags itself and reads all of them: a filter
      # that exits early (e.g., `grep -f` with no published releases) would
      # kill `git tag` with SIGPIPE and fail the step under `pipefail`
      - name: Determine the previous release
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -o pipefail
          published="$(mktemp)"
          gh release list --limit 1000 --exclude-drafts --json tagName \
              --jq '.[].tagName' > "${published}"
          git tag -l 'v*' --merged HEAD \
              | python scripts/release_version.py previous "${TAG}" \
                  --published "${published}" >> "${GITHUB_OUTPUT}"
      # Assets of a published immutable release (a repository setting) can't
      # be added, replaced or deleted, so the release is created as a draft,
      # gets its assets, and is published (with its notes and flags) last.
      # Re-runs finish a draft of an earlier attempt; a release that is
      # already published (e.g., by hand) gets no uploads, but must have all
      # assets, or the step fails, saying what to do (see
      # `scripts/release_assets.py`); only its title, flags and (curated)
      # notes are updated, which stay editable. The final edit is the only
      # one that sets `latest`
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          LATEST: ${{ steps.latest.outputs.latest }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          PREVIOUS: ${{ steps.previous.outputs.previous_tag }}
        run: |
          # With curated notes of the release commit, the body is the curated
          # notes, then the generated ones (the agreed format, see
          # `scripts/release_notes.py`); otherwise the generated ones alone.
          # Generated on every run, so that a draft of an earlier attempt gets
          # the notes since the current previous release
          # Without a previous published release, GitHub's generated notes
          # would start at an older tag of its choice, even one without a
          # release, so the notes of a first release list all merged pull
          # requests in the history of the release commit instead, in
          # GitHub's format (`scripts/release_notes.py first`)
          curated="docs/releases/${VERSION}.md"
          notes_file="$(mktemp)"
          if [[ -n "${PREVIOUS}" ]]; then
              gh api "repos/${GH_REPO}/releases/generate-notes" \
                  -f "tag_name=${TAG}" -f "previous_tag_name=${PREVIOUS}" \
                  --jq .body > "${notes_file}"
          else
              pulls="$(mktemp)"
              commits="$(mktemp)"
              gh api --paginate --slurp \
                  "repos/${GH_REPO}/pulls?state=closed&per_page=100" > "${pulls}"
              git rev-list HEAD > "${commits}"
              python scripts/release_notes.py first "${TAG}" \
                  --repository "${GH_REPO}" --pulls "${pulls}" \
                  --commits "${commits}" > "${notes_file}"
          fi
          if [[ -f "${curated}" ]]; then
              generated="${notes_file}"
              notes_file="$(mktemp)"
              python scripts/release_notes.py body "${curated}" "${generated}" \
                  > "${notes_file}"
          fi
          # GitHub never marks pre-releases as the latest release, so don't
          # ask it to
          if [[ "${PRERELEASE}" == "true" ]]; then
              LATEST=false
          fi
          # All releases of the repository, drafts included, to find those of
          # the tag
          releases="$(mktemp)"
          gh api --paginate --slurp "repos/${GH_REPO}/releases?per_page=100" \
              > "${releases}"
          state="$(python scripts/release_assets.py state "${TAG}" \
              --releases "${releases}" dist/*)"
          state="${state#state=}"
          if [[ "${state}" == "none" ]]; then
              gh release create "${TAG}" \
                  --draft \
                  --verify-tag \
                  --title "${TAG}" \
                  --notes-file "${notes_file}" \
                  --prerelease="${PRERELEASE}"
          fi
          edit=(--title "${TAG}" --prerelease="${PRERELEASE}" --latest="${LATEST}")
          # Uploads to drafts may replace the assets of an earlier attempt.
          # The notes of a published release are replaced only by curated
          # ones (generated ones are left as they are)
          if [[ "${state}" != "published" ]]; then
              gh release upload "${TAG}" dist/* --clobber
              edit+=(--notes-file "${notes_file}")
          elif [[ -f "${curated}" ]]; then
              edit+=(--notes-file "${notes_file}")
          fi
          # Publishes a draft
          gh release edit "${TAG}" "${edit[@]}" --draft=false
