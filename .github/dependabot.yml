version: 2
# Every entry targets `dev` (`target-branch`), which takes all pull
# requests whatever the default branch is (`main` only moves forward to
# releases); security updates always target the default branch, though
updates:
  # Dependencies in `pyproject.toml` and the lock (`uv.lock`), updated
  # together; CI's checks install the locked ones
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    versioning-strategy: increase-if-necessary
    ignore:
      # connexion 3 needs a FOCA upgrade
      - dependency-name: connexion
        update-types: ["version-update:semver-major"]
      # FOCA is bumped by hand, together with the base image (see the `docker`
      # entry): the image build fails unless the base image has the locked
      # FOCA, so separate pull requests of this entry and the `docker` entry
      # would each fail
      - dependency-name: foca
    groups:
      python-dependencies:
        patterns: ["*"]
        exclude-patterns: ["connexion", "foca"]
  # Actions in the workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    groups:
      github-actions:
        patterns: ["*"]
  # Base image and uv image in the `Dockerfile` (tag and digest)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    ignore:
      # FOCA is bumped by hand, in the base image and the `foca` requirement
      # in `pyproject.toml` and `uv.lock` together (the image build fails
      # unless the base image has the locked FOCA; see the `uv` entry)
      - dependency-name: elixircloud/foca
    groups:
      docker:
        patterns: ["*"]
  # Hook revisions in `.pre-commit-config.yaml`
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    groups:
      pre-commit:
        patterns: ["*"]
