# FOCA configuration
# Available in app context as attributes of `foca.get_config()`
# Automatically validated via FOCA
# Cf. https://foca.readthedocs.io/en/latest/configuration/
# Relative file paths are resolved against the directory of this file

# Server configuration
# Cf. https://foca.readthedocs.io/en/latest/configuration/server/
# `host` and `port` apply to the development server
# (`python -m trs_filer.app`) only: the image serves the app with Gunicorn
# (`trs_filer/gunicorn_config.py`)
server:
    host: '0.0.0.0'
    port: 8080
    # Debug mode allows executing arbitrary code; only enable it for local
    # development, on a loopback host
    debug: False
    testing: False
    # Size limit of request bodies, in bytes (1 MiB); larger requests (also
    # chunked ones) are rejected with `413 Content Too Large` before they
    # are parsed. Raise it together with the limits of any proxies in front
    # of the app; the app refuses to start without a limit
    max_content_length: 1048576

# Security configuration, as in Cloud Registry
# Cf. https://foca.readthedocs.io/en/latest/configuration/auth/ and
# https://foca.readthedocs.io/en/latest/configuration/access-control/
security:
    auth:
        add_key_to_claims: True
        algorithms:
          - RS256
        allow_expired: False
        # Only access tokens as per RFC 9068 (`typ` header `at+jwt`); other
        # tokens of the issuers, such as ID tokens, are rejected
        verify_token_type: True
        # The identity providers, their claims and the groups mapped to roles
        # are deployment configuration, without defaults (see "Deployment
        # configuration" in `docs/configuration.md`). Deployments must set:
        # - `issuers`: the trusted token issuers (`iss` claim); tokens of
        #   other issuers are rejected, and the app refuses to start without
        #   any;
        # - `audience`: the audiences of the apps calling TRS-Filer (`aud`
        #   claim, usually the client IDs of portals, gateways or scripts);
        #   FOCA refuses to start without it, unless `verify_audience` is
        #   false.
        # E.g.:
        # issuers:
        #   - https://login.example.org/oidc/
        # audience:
        #   - trs-portal
        issuers: []
        # Claims that the identity provider releases via user info only, not
        # in access tokens, e.g., the group claim (`claim_groups`, needed for
        # the admin role); none by default. E.g.:
        # userinfo_claims:
        #   - groups
    # Access control: anyone may read (the read operations are public;
    # deployments may require login for them, see "Requiring login for reads"
    # in `docs/access-control.md`); only admins may write (register, change
    # and delete tools, versions and tool classes), until tools have owners
    # Cf. https://foca.readthedocs.io/en/latest/access-control/
    access_control:
        enabled: True
        enforce: True
        model: access_control/model.conf
        db_name: trsStore
        collection_name: policy_rules
        # Deployments set the claim with the groups of users (`claim_groups`)
        # and map their admin groups (values of that claim) to the role
        # `admin` (`group_mapping`); the app refuses to start without them,
        # unless `require_admin` is false. E.g.:
        # claim_groups: groups
        # group_mapping:
        #   trs-admins: admin
        # Refuse to start without admins, i.e., unless a group is mapped to
        # the role `admin` (`group_mapping`) or a rule of `policies` grants
        # it (FOCA; false: start with a warning)
        require_admin: True
        # Managed on startup (removed rules are deleted); cannot be changed
        # via the permissions API. Named, so that overlays can change, add or
        # remove single rules by name (`null` removes a rule). No rules for
        # writes (`POST`, `PUT` and `DELETE` of tools, versions and tool
        # classes): only admins may write
        policies:
            # Any authenticated user may read: list tools, get a tool, its
            # versions and their descriptors, tests, files and containerfiles
            # (`/tools/*`), and list tool classes. Only evaluated if a
            # deployment requires login for these reads, which are public
            # otherwise (see "Requiring login for reads" in
            # `docs/access-control.md`)
            list-tools: [p, "*", /ga4gh/trs/v2/tools, GET]
            get-tools: [p, "*", "/ga4gh/trs/v2/tools/*", GET]
            list-tool-classes: [p, "*", /ga4gh/trs/v2/toolClasses, GET]

# Database configuration
# Cf. https://foca.readthedocs.io/en/latest/configuration/db/
# With environment variable `MONGO_DBNAME` set, FOCA uses that database name
# instead of `trsStore`
db:
    # MongoDB service of Docker Compose
    host: mongodb
    port: 27017
    dbs:
        trsStore:
            collections:
                tools:
                    indexes:
                        - keys:
                              id: 1
                          options:
                            'unique': True
                toolclasses:
                    indexes:
                        - keys:
                              id: 1
                          options:
                            'unique': True

# API configuration
# Cf. https://foca.readthedocs.io/en/latest/configuration/api/
# Named (`trs`), so that config overlays can change the spec by its name,
# e.g., add `patches`
api:
    specs:
        trs:
            # Vendored GA4GH specifications, unchanged, named after the date
            # and the abbreviated hash of their commit, and the app's changes
            # and additions (`additions.openapi.yaml`), merged in this order:
            # - service info 1.0.0, `service-info.yaml` of
            #   https://github.com/ga4gh-discovery/ga4gh-service-info at commit
            #   11d2c12 (2020-01-31, the content of tag `v1.0.0`), for the
            #   GA4GH `Service` schema of `GET /service-info`
            # - TRS 2.0.2, `openapi/openapi.yaml` of
            #   https://github.com/ga4gh/tool-registry-service-schemas at
            #   commit 4854e2f (2025-09-02, tag `2.0.2`)
            # Both are licensed under the Apache License 2.0
            path:
                - api/20200131.11d2c12.service-info.yaml
                - api/20250902.4854e2f.openapi.yaml
                - api/additions.openapi.yaml
            # `null` in `additions.openapi.yaml` removes keys of the vendored
            # specifications (e.g., the reference of `/service-info` to the
            # remote service info specification), as in patches
            merge_null_removes: True
            add_operation_fields:
                x-openapi-router-controller: trs_filer.ga4gh.trs.server
            # FOCA's token validation, for the operations that require a
            # token (`security` of `BEARER`: the writes, and reads if login is
            # required for them)
            add_security_fields:
                x-bearerInfoFunc: foca.security.auth.validate_token
            # `True` removes the security requirements: all operations,
            # writes too, are public. For local development only (overlay
            # `config.noauth.yaml`, see "Running without authentication" in
            # `docs/development.md`), never for deployments
            disable_auth: False
            connexion:
                strict_validation: True
                validate_responses: True
                options:
                    swagger_ui: True
                    serve_spec: True

# Service info, served at `GET /service-info` by FOCA, according to the GA4GH
# `Service` schema (validated on startup); `version` defaults to the version
# of the installed package (`package`). Deployments set their own `id`,
# `name`, `description`, `organization`, `contactUrl` and `environment`; `id`
# and `organization` are placeholders with reserved example domains (RFC
# 2606), which FOCA warns of on startup
# Cf. https://foca.readthedocs.io/en/latest/configuration/service-info/
service_info:
    package: trs-filer
    service:
        id: "org.example.trs-filer"
        name: "TRS-Filer"
        type:
            group: "org.ga4gh"
            artifact: "trs"
            version: "2.0.2"
        description: "GA4GH Tool Registry Service (TRS) implementation."
        organization:
            name: "Example Organization"
            url: "https://example.org"
        documentationUrl: "https://github.com/elixir-cloud-aai/trs-filer"
        environment: "dev"
        # Optional timestamps (RFC 3339), served only if set, e.g.:
        # createdAt: "2020-01-01T00:00:00Z"
        # updatedAt: "2026-10-23T00:00:00Z"

# Logging configuration
# Cf. https://foca.readthedocs.io/en/latest/configuration/log/
log:
    version: 1
    disable_existing_loggers: False
    formatters:
        standard:
            class: logging.Formatter
            style: "{"
            format: "[{asctime}: {levelname:<8}] {message} [{name}]"
    handlers:
        console:
            class: logging.StreamHandler
            level: 20
            formatter: standard
            stream: ext://sys.stderr
    root:
        level: 10
        handlers: [console]

# Exception handling: problem details of exceptions, sent with the media type
# of error responses of the GA4GH specifications (instead of FOCA's default
# `application/problem+json`)
# Cf. https://foca.readthedocs.io/en/latest/configuration/exceptions/
exceptions:
    mapping: trs_filer.errors.exceptions.exceptions
    media_type: application/json
    # Requests rejected by Connexion's validation (e.g., of the schema) get
    # the reason as `detail` (shortened to `max_detail_length`, 500
    # characters by default); FOCA's default since 0.18, set explicitly, as
    # clients rely on it
    validation_details: True
    # ... and the validator's reason as up to FOCA 0.21, which quotes the
    # rejected values (FOCA 0.22's default names the invalid fields by
    # location and code instead)
    validation_reasons: True

# Custom configuration
# Available in app context via `trs_filer.utils.get_custom_config()`
# (validated with `trs_filer.custom_config.CustomConfig`)
custom:
    # Public URL of the app, for the `url` properties of tools and versions
    # (`<url_prefix>://<external_host>:<external_port>/<api_path>/...`);
    # deployments set their own
    service:
        url_prefix: http
        external_host: localhost
        external_port: 8080
        api_path: ga4gh/trs/v2
    # Identifiers are drawn from the characters of `charset` (the characters
    # themselves, not an expression)
    tool:
        id:
            charset: ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789
            length: 6
        meta_version:
            init: 1
            increment: 1
            # Whether adding, replacing or deleting a version of a tool
            # increments the tool's meta version, too
            on_version_change: True
    version:
        id:
            charset: abcdefghijklmnopqrstuvwxyz0123456789
            length: 6
        meta_version:
            init: 1
            increment: 1
    toolclass:
        id:
            charset: abcdefghijklmnopqrstuvwxyz0123456789
            length: 6
        meta_version:
            init: 1
            increment: 1
        # Whether tools may only be registered with existing tool classes;
        # if false, unknown tool classes are created
        validation: False
    # Who may add tool classes (as `custom.access_control.service_types` of
    # Cloud Registry): `open`, any user who may register tools, explicitly
    # (`POST /toolClasses`) or by registering a tool with a new tool class
    # (unless `toolclass.validation` is true); by default, only admins write.
    # `controlled` and `moderated` matter only once other users may write
    # (with owners of tools), and are rejected on startup until supported
    access_control:
        tool_classes: open
    # Retrieval of file content from URLs: on registration, for files with a
    # `url` but no `content`, and for zip archives of files without stored
    # content. Only `https` is allowed (add `http` if needed); hosts must
    # resolve to public addresses only (also after redirects), unless listed
    # in `allowed_hosts` (host names, IP addresses or CIDR networks, e.g.,
    # for local setups). Timeouts are in seconds (`connect_timeout` per
    # address, `read_timeout` per read, `total_timeout` per file, including
    # redirects; name resolution isn't limited), `max_size` in bytes.
    # Proxy settings of the environment are not used
    remote_files:
        schemes: [https]
        allowed_hosts: []
        connect_timeout: 5
        read_timeout: 10
        total_timeout: 30
        max_size: 1048576
        max_redirects: 5
