# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    # Python version of the base image in the `Dockerfile`
    python: "3.13"

mkdocs:
  configuration: mkdocs.yml
  # Fail on all warnings to avoid broken links and references
  fail_on_warning: true

# From the ranges of `pyproject.toml`, not the lock (`uv.lock`), which CI's
# docs job builds with (see "Dependencies" in `docs/development.md`)
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
